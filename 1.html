<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>반발경도 추정강도 계산기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
  <div class="max-w-4xl mx-auto p-4 sm:p-6 md:p-8 space-y-5">
    <!-- 상단 헤더 -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <a href="../index.html" class="h-11 px-4 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-sm font-bold flex items-center">← 작업대 홈</a>
          <div>
            <span class="text-xs font-semibold text-slate-500">현장조사·비파괴</span>
            <h1 class="text-lg sm:text-xl font-bold">🔨 반발경도(슈미트해머) 추정강도 계산기</h1>
          </div>
        </div>
        <button onclick="window.open(location.href, '_blank')" class="h-11 px-3.5 rounded-lg border border-slate-300 dark:border-slate-700 text-sm font-medium">새 창 열기 ↗</button>
      </div>
      <div class="p-3.5 rounded-xl bg-blue-50/70 dark:bg-blue-950/40 border border-blue-100 dark:border-blue-900 text-xs sm:text-sm">
        ℹ️ <strong>적용 기준:</strong> 안전점검 및 정밀안전진단 세부지침 — 보정 반발도 $R = R_0 + \Delta R$, 일본건축학회식 $F_c = (7.3R + 100) \times 0.098 \times \alpha$ ($\text{MPa}$)
      </div>
    </div>

    <!-- 입력 및 계산 영역 -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm space-y-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1.5">측정 부재명</label>
          <input type="text" id="member" value="P1 교각 구체" oninput="calc()" class="w-full h-12 px-4 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
        </div>
        <div>
          <label class="block text-sm font-bold mb-1.5">타격 각도 보정 (ΔR)</label>
          <select id="angle" onchange="calc()" class="w-full h-12 px-3.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800">
            <option value="0">수평 타격 (0° / 0)</option>
            <option value="-4.5">수직 상향 (+90° / -4.5)</option>
            <option value="-3.0">경사 상향 (+45° / -3.0)</option>
            <option value="2.5">경사 하향 (-45° / +2.5)</option>
            <option value="3.5">수직 하향 (-90° / +3.5)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-bold mb-1.5">재령 보정계수 (α)</label>
          <select id="alpha" onchange="calc()" class="w-full h-12 px-3.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800">
            <option value="1.00">28일 기준 (1.00)</option>
            <option value="0.78">100일 이상 (0.78)</option>
            <option value="0.67">500일 이상 (0.67)</option>
            <option value="0.63">1,000일 이상 노후구조물 (0.63)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-bold mb-1.5">평균 타격치 (R0)</label>
          <input type="number" inputmode="decimal" step="0.1" id="r0" value="36.5" oninput="calc()" class="w-full h-12 px-4 text-lg font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-bold mb-1.5">또는 20점 개별 타격치 입력 (입력 시 자동 평균 계산, ±20% 이상치 제외)</label>
        <textarea id="points" rows="2" inputmode="decimal" oninput="calcFromPoints()" placeholder="예: 36, 37, 35, 38, 36..." class="w-full p-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-mono text-sm"></textarea>
      </div>

      <!-- 결과 출력 -->
      <div class="p-5 rounded-xl bg-slate-100 dark:bg-slate-800 space-y-4">
        <div class="grid grid-cols-3 gap-3">
          <div>
            <p class="text-xs text-slate-500">평균 타격치 (R0)</p>
            <p id="out-r0" class="text-xl font-bold mt-1">36.5</p>
          </div>
          <div>
            <p class="text-xs text-slate-500">보정 반발도 (R)</p>
            <p id="out-r" class="text-xl font-bold mt-1">36.5</p>
          </div>
          <div class="bg-[#1E3A8A] text-white p-3 rounded-xl">
            <p class="text-xs text-blue-200">추정 압축강도 (Fc)</p>
            <p id="out-fc" class="text-2xl font-extrabold mt-0.5">35.9 MPa</p>
          </div>
        </div>

        <div class="flex flex-wrap gap-2 pt-3 border-t border-slate-200 dark:border-slate-700">
          <button onclick="copyResult()" class="h-12 px-4 rounded-lg bg-[#1E3A8A] text-white font-semibold text-sm">📋 보고서용 결과 복사</button>
          <button onclick="downloadCSV()" class="h-12 px-4 rounded-lg bg-emerald-700 text-white font-semibold text-sm">📥 엑셀(CSV) 저장</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('wb_dark') === 'true') document.documentElement.classList.add('dark');
    const KEY = 'tool_rebound_v1';

    function calcFromPoints() {
      const nums = document.getElementById('points').value.split(/[\s,]+/).map(Number).filter(n => n > 0);
      if (nums.length > 0) {
        const mean = nums.reduce((a, b) => a + b, 0) / nums.length;
        const valid = nums.filter(v => Math.abs(v - mean) <= mean * 0.2);
        const avg = valid.reduce((a, b) => a + b, 0) / valid.length;
        document.getElementById('r0').value = avg.toFixed(1);
      }
      calc();
    }

    function calc() {
      const member = document.getElementById('member').value;
      const r0 = parseFloat(document.getElementById('r0').value) || 0;
      const angle = parseFloat(document.getElementById('angle').value) || 0;
      const alpha = parseFloat(document.getElementById('alpha').value) || 1;
      const r = r0 > 0 ? r0 + angle : 0;
      const fc = r > 0 ? (7.3 * r + 100) * 0.098 * alpha : 0;

      document.getElementById('out-r0').textContent = r0.toFixed(1);
      document.getElementById('out-r').textContent = r.toFixed(1);
      document.getElementById('out-fc').textContent = fc.toFixed(1) + ' MPa';

      localStorage.setItem(KEY, JSON.stringify({ member, r0, angle, alpha }));
      window._last = { member, r0, angle, r, alpha, fc };
    }

    function copyResult() {
      const d = window._last;
      const txt = `[반발경도 추정강도] 부재: ${d.member} | R0: ${d.r0.toFixed(1)} | 보정 R: ${d.r.toFixed(1)} | 재령계수 α: ${d.alpha} | 추정강도 Fc: ${d.fc.toFixed(1)} MPa`;
      navigator.clipboard.writeText(txt);
      alert('보고서용 텍스트가 복사되었습니다.');
    }

    function downloadCSV() {
      const d = window._last;
      const csv = `\uFEFF부재명,평균타격치(R0),각도보정,보정반발경도(R),재령계수(α),추정압축강도(MPa)\n${d.member},${d.r0.toFixed(1)},${d.angle},${d.r.toFixed(1)},${d.alpha},${d.fc.toFixed(1)}`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      a.download = `반발경도_${d.member}.csv`;
      a.click();
    }

    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved) {
      document.getElementById('member').value = saved.member;
      document.getElementById('r0').value = saved.r0;
      document.getElementById('angle').value = saved.angle;
      document.getElementById('alpha').value = saved.alpha;
    }
    calc();
  </script>
</body>
</html>
