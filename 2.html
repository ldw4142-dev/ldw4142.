<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>탄산화 깊이 & 잔여수명 예측기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
  <div class="max-w-4xl mx-auto p-4 sm:p-6 md:p-8 space-y-5">
    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <a href="../index.html" class="h-11 px-4 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-sm font-bold flex items-center">← 작업대 홈</a>
          <div>
            <span class="text-xs font-semibold text-slate-500">현장조사·비파괴</span>
            <h1 class="text-lg sm:text-xl font-bold">🛡️ 탄산화 깊이 & 잔여수명 예측기</h1>
          </div>
        </div>
        <button onclick="window.open(location.href, '_blank')" class="h-11 px-3.5 rounded-lg border border-slate-300 dark:border-slate-700 text-sm font-medium">새 창 열기 ↗</button>
      </div>
      <div class="p-3.5 rounded-xl bg-blue-50/70 dark:bg-blue-950/40 border border-blue-100 dark:border-blue-900 text-xs sm:text-sm">
        ℹ️ <strong>적용 기준:</strong> $\sqrt{t}$ 법칙($C = A\sqrt{t}$) — 탄산화 속도계수 $A = C / \sqrt{t}$, 철근 도달 한계년수 $T = (d / A)^2$, 잔여수명 $= T - t$
      </div>
    </div>

    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm space-y-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1.5">측정 부재명</label>
          <input type="text" id="member" value="A1 교대 흉벽" oninput="calc()" class="w-full h-12 px-4 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
        </div>
        <div>
          <label class="block text-sm font-bold mb-1.5">피복두께 d (mm)</label>
          <input type="number" inputmode="decimal" step="0.1" id="d" value="50.0" oninput="calc()" class="w-full h-12 px-4 text-lg font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
        </div>
        <div>
          <label class="block text-sm font-bold mb-1.5">측정 탄산화 깊이 C (mm)</label>
          <input type="number" inputmode="decimal" step="0.1" id="c" value="14.5" oninput="calc()" class="w-full h-12 px-4 text-lg font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
        </div>
        <div>
          <label class="block text-sm font-bold mb-1.5">준공 후 경과년수 t (년)</label>
          <input type="number" inputmode="decimal" step="0.5" id="t" value="18" oninput="calc()" class="w-full h-12 px-4 text-lg font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
        </div>
      </div>

      <div class="p-5 rounded-xl bg-slate-100 dark:bg-slate-800 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="bg-white dark:bg-slate-900 p-4 rounded-xl">
            <p class="text-xs text-slate-500">탄산화 속도계수 (A)</p>
            <p id="out-a" class="text-2xl font-bold mt-1">3.42 mm/√년</p>
          </div>
          <div class="bg-white dark:bg-slate-900 p-4 rounded-xl">
            <p class="text-xs text-slate-500">잔여 피복두께 (d - C)</p>
            <p id="out-rem-d" class="text-2xl font-bold mt-1">35.5 mm</p>
          </div>
          <div class="bg-[#1E3A8A] text-white p-4 rounded-xl">
            <p class="text-xs text-blue-200">철근 도달 잔여수명</p>
            <p id="out-life" class="text-2xl font-extrabold mt-1">196.1 년</p>
          </div>
        </div>

        <div class="flex flex-wrap gap-2 pt-3 border-t border-slate-200 dark:border-slate-700">
          <button onclick="copyResult()" class="h-12 px-4 rounded-lg bg-[#1E3A8A] text-white font-semibold text-sm">📋 보고서용 결과 복사</button>
          <button onclick="downloadCSV()" class="h-12 px-4 rounded-lg bg-emerald-700 text-white font-semibold text-sm">📥 엑셀(CSV) 저장</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('wb_dark') === 'true') document.documentElement.classList.add('dark');
    const KEY = 'tool_carbonation_v1';

    function calc() {
      const member = document.getElementById('member').value;
      const d = parseFloat(document.getElementById('d').value) || 0;
      const c = parseFloat(document.getElementById('c').value) || 0;
      const t = parseFloat(document.getElementById('t').value) || 0;

      const a = t > 0 ? c / Math.sqrt(t) : 0;
      const remD = d - c;
      const life = a > 0 ? Math.max(0, Math.pow(d / a, 2) - t) : 0;

      document.getElementById('out-a').textContent = a.toFixed(2) + ' mm/√년';
      document.getElementById('out-rem-d').textContent = remD.toFixed(1) + ' mm';
      document.getElementById('out-life').textContent = life > 0 ? life.toFixed(1) + ' 년' : '0.0 년 (도달)';

      localStorage.setItem(KEY, JSON.stringify({ member, d, c, t }));
      window._last = { member, d, c, remD, t, a, life };
    }

    function copyResult() {
      const x = window._last;
      navigator.clipboard.writeText(`[탄산화 잔여수명] 부재: ${x.member} | 피복: ${x.d}mm | 탄산화: ${x.c}mm | 경과: ${x.t}년 | 속도계수 A: ${x.a.toFixed(2)} | 잔여수명: ${x.life.toFixed(1)}년`);
      alert('보고서용 텍스트가 복사되었습니다.');
    }

    function downloadCSV() {
      const x = window._last;
      const csv = `\uFEFF부재명,피복두께(mm),탄산화깊이(mm),잔여피복(mm),경과년수(년),속도계수(A),잔여수명(년)\n${x.member},${x.d},${x.c},${x.remD.toFixed(1)},${x.t},${x.a.toFixed(2)},${x.life.toFixed(1)}`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      a.download = `탄산화_${x.member}.csv`;
      a.click();
    }

    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved) {
      document.getElementById('member').value = saved.member;
      document.getElementById('d').value = saved.d;
      document.getElementById('c').value = saved.c;
      document.getElementById('t').value = saved.t;
    }
    calc();
  </script>
</body>
</html>
