<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개인 엔지니어링 작업대 (Engineering Workbench)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: '#1E3A8A',
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
  <div class="min-h-screen flex flex-col md:flex-row">
    <!-- PC 좌측 사이드바 -->
    <aside class="hidden md:flex md:w-72 md:flex-col md:fixed md:inset-y-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 z-20">
      <div class="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[#1E3A8A] text-white flex items-center justify-center font-bold">EW</div>
        <div>
          <p class="text-[11px] font-bold text-[#1E3A8A] dark:text-blue-400">CIVIL & SAFETY ENG</p>
          <h2 class="text-base font-extrabold">개인 엔지니어링 작업대</h2>
        </div>
      </div>

      <div class="flex-1 p-3 space-y-5 overflow-y-auto">
        <button onclick="openHome()" id="nav-home" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-bold bg-[#1E3A8A] text-white">
          <span>🏠</span><span>작업대 홈 (런처)</span>
        </button>

        <div>
          <p class="px-3 text-xs font-bold text-slate-400 mb-2">★ 즐겨찾기 & 등록된 도구</p>
          <div id="sidebar-tools" class="space-y-1"></div>
        </div>
      </div>

      <div class="p-3.5 border-t border-slate-200 dark:border-slate-800 space-y-2.5 bg-slate-50/70 dark:bg-slate-900">
        <div class="px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold flex items-center gap-2">
          <span class="text-slate-400">○</span>
          <span>오프라인 - 내장 계산기만 사용 가능</span>
        </div>
        <button onclick="toggleDark()" class="w-full h-11 px-3.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-semibold">
          🌓 다크 / 라이트 모드 전환
        </button>
      </div>
    </aside>

    <!-- 모바일 헤더 -->
    <header class="md:hidden sticky top-0 z-20 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 h-14 flex items-center justify-between">
      <button onclick="openHome()" class="font-extrabold text-sm flex items-center gap-2">
        <span class="px-2 py-1 rounded bg-[#1E3A8A] text-white text-xs">EW</span>
        <span>개인 엔지니어링 작업대</span>
      </button>
      <button onclick="toggleDark()" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold">🌓 테마</button>
    </header>

    <!-- 메인 영역 -->
    <main class="flex-1 md:pl-72 pb-20 md:pb-10">
      <div class="max-w-5xl mx-auto p-4 sm:p-6 md:p-8">
        <!-- 홈 런처 뷰 -->
        <div id="home-view" class="space-y-6">
          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm space-y-4">
            <div>
              <h1 class="text-2xl font-bold">엔지니어링 개인 작업대</h1>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                현장조사 비파괴 계산기부터 내업 문서 자동화 도구까지 한곳에서 실행합니다.
              </p>
            </div>
            <input type="text" id="search-box" oninput="renderHome()" placeholder="🔍 도구 이름, 설명 또는 태그 검색 (#비파괴, #탄산화, #PDF)..." class="w-full h-12 px-4 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none focus:ring-2 focus:ring-[#1E3A8A]" />
            <div class="flex flex-wrap gap-2" id="category-tabs"></div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="tool-cards"></div>
        </div>

        <!-- 도구 실행 작업 영역 -->
        <div id="workspace-view" class="hidden space-y-5"></div>
      </div>
    </main>
  </div>

  <script>
    const TOOLS = [
      {
        id: 'rebound',
        name: '반발경도(슈미트해머) 추정강도 계산기',
        category: '현장조사·비파괴',
        mode: '내장 계산기 (오프라인 OK)',
        icon: '🔨',
        tags: ['#비파괴', '#슈미트해머', '#압축강도', '#콘크리트'],
        desc: '타격방향·재령 보정계수 및 타격치를 반영하여 콘크리트 추정 압축강도(MPa)를 산출합니다.',
        note: '안전진단 세부지침 기준: 보정 반발도 R = R0 + ΔR(타격각도), 재령계수(α) 적용 및 일본건축학회식 Fc = (7.3R + 100) × 0.098 × α 산출.'
      },
      {
        id: 'carbonation',
        name: '탄산화 깊이 & 잔여수명 예측기',
        category: '현장조사·비파괴',
        mode: '내장 계산기 (오프라인 OK)',
        icon: '🛡️',
        tags: ['#비파괴', '#탄산화', '#잔여수명', '#내구성'],
        desc: '피복두께, 현재 탄산화 깊이, 경과년수를 입력해 속도계수(A)와 철근 도달 잔여수명을 예측합니다.',
        note: '콘크리트 표준시방서(√t 법칙): 속도계수 A = C / √t, 철근 도달 한계깊이 도달년수 T = (d / A)².'
      },
      {
        id: 'hwpx',
        name: '한글(HWPX) → PDF 일괄 변환기',
        category: '내업·문서자동화',
        mode: 'PC 서버 연동형',
        icon: '📄',
        tags: ['#내업', '#한글', '#PDF변환', '#보고서'],
        desc: '여러 개의 한글 보고서(.hwpx) 파일을 로컬 PC FastAPI 서버로 전송해 PDF로 일괄 변환합니다.',
        note: '사무실 PC에서 실행 중인 FastAPI 서버의 /convert-pdf 엔드포인트와 연동되는 UI 틀입니다.'
      }
    ];

    let selectedCat = '전체';
    let favorites = ['rebound', 'carbonation'];

    function renderHome() {
      const q = document.getElementById('search-box').value.toLowerCase();
      const cats = ['전체', '현장조사·비파괴', '내업·문서자동화', '상태평가·구조계산', '기타 유틸리티'];
      document.getElementById('category-tabs').innerHTML = cats.map(c => `
        <button onclick="selectedCat='${c}'; renderHome()" class="h-10 px-4 rounded-lg text-sm font-semibold ${selectedCat === c ? 'bg-[#1E3A8A] text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}">${c}</button>
      `).join('');

      document.getElementById('sidebar-tools').innerHTML = TOOLS.map(t => `
        <button onclick="openTool('${t.id}')" class="w-full flex items-center gap-2.5 px-3.5 py-2.5 rounded-lg text-sm font-medium text-left hover:bg-slate-100 dark:hover:bg-slate-800">
          <span>${t.icon}</span><span class="truncate">${t.name}</span>
        </button>
      `).join('');

      const filtered = TOOLS.filter(t => {
        const matchC = selectedCat === '전체' || t.category === selectedCat;
        const matchQ = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.tags.some(tag => tag.toLowerCase().includes(q));
        return matchC && matchQ;
      });

      document.getElementById('tool-cards').innerHTML = filtered.map(t => `
        <div onclick="openTool('${t.id}')" class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-[#1E3A8A] p-5 shadow-sm cursor-pointer flex flex-col justify-between gap-4">
          <div class="space-y-3">
            <div class="flex items-start justify-between">
              <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-lg bg-blue-50 dark:bg-blue-950 text-xl flex items-center justify-center">${t.icon}</div>
                <div>
                  <span class="text-[11px] font-semibold text-slate-500 block">${t.category}</span>
                  <span class="text-[11px] font-semibold px-2 py-0.5 rounded ${t.id === 'hwpx' ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700'}">${t.mode}</span>
                </div>
              </div>
              <span class="text-amber-400 text-lg">${favorites.includes(t.id) ? '★' : '☆'}</span>
            </div>
            <div>
              <h3 class="font-bold text-base">${t.name}</h3>
              <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">${t.desc}</p>
            </div>
          </div>
          <div class="flex flex-wrap gap-1.5 pt-2 border-t border-slate-100 dark:border-slate-800">
            ${t.tags.map(tag => `<span class="text-xs px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800">${tag}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    function openHome() {
      document.getElementById('home-view').classList.remove('hidden');
      document.getElementById('workspace-view').classList.add('hidden');
    }

    function openTool(id) {
      const t = TOOLS.find(x => x.id === id);
      document.getElementById('home-view').classList.add('hidden');
      const ws = document.getElementById('workspace-view');
      ws.classList.remove('hidden');

      let bodyHtml = '';
      if (id === 'rebound') {
        bodyHtml = `
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">
            <div>
              <label class="block text-sm font-bold mb-1.5">평균 타격치 (R0)</label>
              <input type="number" id="rb-r0" value="36.5" oninput="calcRebound()" class="w-full h-12 px-4 text-lg font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
            </div>
            <div>
              <label class="block text-sm font-bold mb-1.5">타격 각도 보정 (ΔR)</label>
              <select id="rb-angle" onchange="calcRebound()" class="w-full h-12 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800">
                <option value="0">수평 (0°)</option>
                <option value="-4.5">수직 상향 (+90°)</option>
                <option value="3.5">수직 하향 (-90°)</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-bold mb-1.5">재령 계수 (α)</label>
              <select id="rb-alpha" onchange="calcRebound()" class="w-full h-12 px-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800">
                <option value="1.00">28일 기준 (1.00)</option>
                <option value="0.78">100일 이상 (0.78)</option>
                <option value="0.63">1,000일 이상 (0.63)</option>
              </select>
            </div>
          </div>
          <div class="p-5 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-500">보정 반발경도 (R)</p>
              <p id="rb-r-out" class="text-2xl font-bold">36.5</p>
            </div>
            <div class="bg-[#1E3A8A] text-white px-5 py-3 rounded-xl text-right">
              <p class="text-xs text-blue-200">추정 압축강도 (Fc)</p>
              <p id="rb-fc-out" class="text-2xl font-extrabold">35.9 MPa</p>
            </div>
          </div>
        `;
      } else if (id === 'carbonation') {
        bodyHtml = `
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">
            <div>
              <label class="block text-sm font-bold mb-1.5">피복두께 d (mm)</label>
              <input type="number" id="cb-d" value="50" oninput="calcCarb()" class="w-full h-12 px-4 text-lg font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
            </div>
            <div>
              <label class="block text-sm font-bold mb-1.5">탄산화 깊이 C (mm)</label>
              <input type="number" id="cb-c" value="14.5" oninput="calcCarb()" class="w-full h-12 px-4 text-lg font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
            </div>
            <div>
              <label class="block text-sm font-bold mb-1.5">경과년수 t (년)</label>
              <input type="number" id="cb-t" value="18" oninput="calcCarb()" class="w-full h-12 px-4 text-lg font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
            </div>
          </div>
          <div class="p-5 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-between">
            <div>
              <p class="text-xs text-slate-500">탄산화 속도계수 (A)</p>
              <p id="cb-a-out" class="text-2xl font-bold">3.42 mm/√년</p>
            </div>
            <div class="bg-[#1E3A8A] text-white px-5 py-3 rounded-xl text-right">
              <p class="text-xs text-blue-200">철근 도달 잔여수명</p>
              <p id="cb-life-out" class="text-2xl font-extrabold">196.1 년</p>
            </div>
          </div>
        `;
      } else {
        bodyHtml = `
          <div class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-8 text-center space-y-2">
            <div class="text-3xl">📂</div>
            <p class="font-bold">한글(.hwpx, .hwp) 파일을 선택해 PC FastAPI 서버로 전송</p>
            <p class="text-xs text-slate-500">사무실 PC 서버(http://localhost:8000/convert-pdf) 연결 시 PDF 일괄 다운로드가 실행됩니다.</p>
          </div>
        `;
      }

      ws.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm space-y-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <button onclick="openHome()" class="h-11 px-4 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm font-bold">← 홈으로</button>
              <h1 class="text-lg sm:text-xl font-bold">${t.icon} ${t.name}</h1>
            </div>
          </div>
          <div class="p-3.5 rounded-xl bg-blue-50/70 dark:bg-blue-950/30 border border-blue-100 dark:border-blue-900 text-xs sm:text-sm">
            ℹ️ ${t.note}
          </div>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm">
          ${bodyHtml}
        </div>
      `;
    }

    function calcRebound() {
      const r0 = parseFloat(document.getElementById('rb-r0').value) || 0;
      const d = parseFloat(document.getElementById('rb-angle').value) || 0;
      const a = parseFloat(document.getElementById('rb-alpha').value) || 1;
      const r = r0 + d;
      const fc = (7.3 * r + 100) * 0.098 * a;
      document.getElementById('rb-r-out').textContent = r.toFixed(1);
      document.getElementById('rb-fc-out').textContent = fc.toFixed(1) + ' MPa';
    }

    function calcCarb() {
      const d = parseFloat(document.getElementById('cb-d').value) || 0;
      const c = parseFloat(document.getElementById('cb-c').value) || 0;
      const t = parseFloat(document.getElementById('cb-t').value) || 0;
      const a = t > 0 ? c / Math.sqrt(t) : 0;
      const rem = a > 0 ? Math.max(0, Math.pow(d / a, 2) - t) : 0;
      document.getElementById('cb-a-out').textContent = a.toFixed(2) + ' mm/√년';
      document.getElementById('cb-life-out').textContent = rem.toFixed(1) + ' 년';
    }

    function toggleDark() {
      document.documentElement.classList.toggle('dark');
    }

    renderHome();
  </script>
</body>
</html>
