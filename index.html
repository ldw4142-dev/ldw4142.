<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<title>안전진단 작업대</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--sub:#5b6676;--line:#d9dfe7;--pri:#1f3a5f;--acc:#c8501e;--ok:#2a7d4f;--warn:#b7791f;--bad:#b83232;--fs:14px}
[data-theme=dark]{--bg:#12161c;--card:#1b2129;--ink:#e6eaf0;--sub:#9aa5b5;--line:#2b3440;--pri:#7fa8dc;--acc:#f08a5d;--ok:#52b788;--warn:#e0a84a;--bad:#e56b6b}
*{box-sizing:border-box}
body{margin:0;font:var(--fs)/1.5 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
body.field{--fs:18px}
body.field button,body.field input,body.field select,body.field textarea{min-height:48px;font-size:18px}
header{position:sticky;top:0;z-index:10;background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:wrap}
[data-theme=dark] header{background:#222c39;color:#e6eaf0}
header h1{font-size:16px;margin:0 10px 0 0}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav a{color:inherit;text-decoration:none;padding:6px 10px;border-radius:6px;opacity:.85;cursor:pointer}
nav a.on,nav a:hover{background:rgba(255,255,255,.18);opacity:1}
.hbtn{background:rgba(255,255,255,.15);color:inherit;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:0 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:2px;flex:1;min-width:110px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:70px}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
[data-theme=dark] button.p{color:#12161c}
button.d{color:var(--bad)}
button:hover{filter:brightness(.95)}
.muted{color:var(--sub);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--sub)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.note{border-left:3px solid var(--warn);background:var(--bg);padding:6px 10px;font-size:12px;color:var(--sub);margin:8px 0;border-radius:0 6px 6px 0}
.steps{display:flex;gap:3px;margin:8px 0}
.steps i{flex:1;height:8px;border-radius:4px;background:var(--line);cursor:pointer}
.steps i.on{background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left}th{background:var(--bg)}
td input,td select{padding:3px 5px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.chk input{width:auto;margin-top:4px;transform:scale(1.2)}
.res{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:6px;font-weight:600}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs button.on{background:var(--pri);color:#fff}
[data-theme=dark] .tabs button.on{color:#12161c}
footer{text-align:center;color:var(--sub);font-size:12px;padding:20px}
.big{font-size:22px;font-weight:700}
@media(max-width:640px){main{padding:10px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>안전진단 작업대</h1>
  <nav id="nav"></nav>
  <button class="hbtn" id="fieldBtn" title="현장 모드(큰 글씨)">현장모드</button>
  <button class="hbtn" id="themeBtn">☾</button>
</header>
<main id="app"></main>
<footer>(주)KG엔지니어링 종합건축사사무소 · 계산 결과는 참고용이며 최신 세부지침·시방서로 반드시 확인하세요 · 입력값은 이 브라우저에만 저장됩니다</footer>

<script>
/* ===== 설정 데이터 (코드와 분리: 필요 시 설정 화면에서 JSON으로 교체) ===== */
const DEFAULT_TOOLS=[
 {name:"외관조사망도 합본",type:"exe",run:"C:\\tools\\merge_drawings.exe",in:"외관조사망도 PDF 여러 장",out:"합본 PDF 1개",version:"0.0",memo:"도면번호순 합본. 경로를 본인 PC에 맞게 수정하세요."},
 {name:"보고서 자동화",type:"py",run:"python C:\\tools\\report_auto.py",in:"점검시트 xlsx",out:"보고서(hwpx)",version:"0.0",memo:"경로 수정 후 사용"},
 {name:"손상물량 LISP",type:"lisp",run:"(load \"C:/tools/damage_qty.lsp\")",in:"AutoCAD 도면",out:"물량표",version:"0.0",memo:"AutoCAD 명령창에 붙여넣기"},
 {name:"국가시설물통합정보관리시스템(FMS)",type:"link",run:"https://www.fms.go.kr",in:"-",out:"-",version:"-",memo:"외부 링크 예시"}
];
const DEFAULT_SNIPPETS=[
 {cat:"손상 설명",title:"균열",text:"콘크리트 표면에 균열이 발생하였으며, 향후 진행 여부 확인을 위한 추적 관찰이 필요함."},
 {cat:"손상 설명",title:"박리·박락",text:"콘크리트 표면 박리 및 박락이 발생하여 철근 노출 우려가 있음."},
 {cat:"보수·보강",title:"균열 보수",text:"균열 폭에 따라 표면처리 또는 주입 공법 적용 후 표면보호."},
 {cat:"보수·보강",title:"단면복구",text:"열화부 제거 후 방청 처리 및 단면복구, 표면보호재 도포."}
];
const CLOSE_TYPES=[["long","장기 (3일 초과)"],["mid","중기 (1~3일)"],["short","단기 (1일 이내·야간)"],["brief","단시간 (1시간 이내)"],["move","이동작업"]];
/* 근거: 도로 작업 전 안전관리 점검표(공사유형·안전시설), 도로공사장 교통관리지침, 도로교통법 제69조 신고, 도로법 제61조 점용허가 — 현행 조문·개정은 직접 확인 */
const CLOSE_DOCS=[
 "도로교통법 제69조 공사 신고서 (공사 3일 전까지 접수)",
 "교통통제계획 (노선버스 우회 포함)",
 "안전시설 설치계획 (교통관리 예시도 첨부)",
 "도로점용허가 필요 여부 확인 (도로법 제61조) · 필요 시 신청서+설계도면",
 "도로관리청 협의 필요 여부 확인",
 "발주처(관리주체) 사전 통보",
 "차단업체 계약/확약 및 장비·인원 확인"
];
const CLOSE_SAFE=["안전표지","도류화시설(교통콘)","신호수","작업보호자동차(트럭 장착 완충시설)","점멸차단판(싸인보드)","투입원 안전조끼·안전모·안전화","경고등"];
const CLOSE_AFTER=["공사 종료 후 원상복구 확인","사용 안전시설물 회수·제거 확인"];
const STAGES=["착수","현장조사","CAD 최신화","물량 정리","점검시트","보고서"];
const KSMETHODS=["KS F 2713 (염화물 분석)","KS F 2714 (산가용성 염화물)","KS F 2715 (수용성 염화물)","기타(직접 입력)"];
const SITE_CHECK=["외관조사망도 출력·준비","현장 안전장구 확인","사다리/교량점검차 일정 확인","도로차단 업체·신고 완료 확인","비파괴 장비(슈미트해머·균열폭 게이지 등) 점검","카메라·배터리 충전","손상 사진번호 기록 방식 확인","하부 접근 가능 여부 확인(하천 수위 등)"];

/* ===== 저장소 ===== */
const KEY="safety_workbench_v1";
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return Object.assign(base(),s)}catch(e){}return base()}
function base(){return{facilities:[],vendors:[],closures:[],tests:[],tools:DEFAULT_TOOLS.slice(),snippets:DEFAULT_SNIPPETS.slice(),qty:[],siteChecks:{},cal:{},ui:{theme:"light",field:false,sel:null}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("저장 실패: 저장 공간을 확인하세요")}}
const uid=()=>Math.random().toString(36).slice(2,9);
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
function copy(t){navigator.clipboard?.writeText(t).then(()=>toast("복사됨"),()=>fallback(t));function fallback(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();toast("복사됨")}}
function toast(m){const d=document.createElement("div");d.textContent=m;d.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:99";document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
function download(name,text,type="application/json"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function csvDownload(name,rows){const t="\ufeff"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");download(name,t,"text/csv")}
const facName=id=>S.facilities.find(f=>f.id===id)?.name||"(미지정)";
function facOptions(sel){return `<option value="">시설물 선택</option>`+S.facilities.map(f=>`<option value="${f.id}" ${f.id===sel?"selected":""}>${esc(f.name)}</option>`).join("")}

/* ===== 라우팅 ===== */
const ROUTES=[["home","홈"],["fac","시설물"],["calc","계산·판정"],["prep","현장조사 준비"],["tools","자동화 도구함"],["lib","자료실"],["set","설정"]];
let route=(location.hash||"#home").slice(1)||"home";
let prepTab="close",calcTab="rebound";
function go(r){route=r;location.hash=r;render()}
window.addEventListener("hashchange",()=>{route=(location.hash||"#home").slice(1)||"home";render()});
function render(){
  document.documentElement.dataset.theme=S.ui.theme;
  document.body.classList.toggle("field",!!S.ui.field);
  $("#themeBtn").textContent=S.ui.theme==="dark"?"☀":"☾";
  $("#nav").innerHTML=ROUTES.map(([k,n])=>`<a class="${route===k?"on":""}" onclick="go('${k}')">${n}</a>`).join("");
  const v={home:vHome,fac:vFac,calc:vCalc,prep:vPrep,tools:vTools,lib:vLib,set:vSet}[route]||vHome;
  $("#app").innerHTML=v();
  if(typeof afterRender==="function")afterRender();
}
$("#themeBtn").onclick=()=>{S.ui.theme=S.ui.theme==="dark"?"light":"dark";save();render()};
$("#fieldBtn").onclick=()=>{S.ui.field=!S.ui.field;save();render()};

/* ===== 홈 ===== */
function dday(d){if(!d)return"";const n=Math.ceil((new Date(d)-new Date(new Date().toDateString()))/864e5);return n<0?`D+${-n}`:n===0?"D-day":`D-${n}`}
function vHome(){
  const fs=S.facilities;
  const cards=fs.map(f=>`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(f.name)}</h3><span class="tag">${esc(f.type)}</span></div>
   <div class="steps">${STAGES.map((s,i)=>`<i class="${f.stage[i]?"on":""}" title="${s}" onclick="toggleStage('${f.id}',${i})"></i>`).join("")}</div>
   <div class="muted">${STAGES.map((s,i)=>f.stage[i]?`<b>${s}</b>`:s).join(" · ")}</div>
   <div class="row"><span class="tag ${f.due&&new Date(f.due)<new Date()?"warn":""}">마감 ${esc(f.due||"-")} ${dday(f.due)}</span>
   <button onclick="S.ui.sel='${f.id}';save();go('fac')">상세</button></div></div>`).join("");
  const tl=S.tools.slice(0,4).map(t=>`<button onclick="go('tools')">${esc(t.name)}</button>`).join(" ");
  return `<h2>진행 중 시설물</h2>
  <div class="grid">${cards}<div class="card"><h3>+ 시설물 추가</h3>${facForm()}</div></div>
  <h2 style="margin-top:20px">바로가기</h2>
  <div class="card"><div class="row">
   <button onclick="calcTab='rebound';go('calc')">반발경도</button><button onclick="calcTab='crack';go('calc')">균열폭</button>
   <button onclick="calcTab='qty';go('calc')">손상물량</button>
   <button onclick="prepTab='close';go('prep')">도로차단</button><button onclick="prepTab='test';go('prep')">시험의뢰</button> ${tl}</div></div>`;
}
function facForm(){return `<div class="row"><label>시설물명<input id="nf_name" placeholder="예: 학야교"></label></div>
 <div class="row"><label>구분<select id="nf_type"><option>교량</option><option>터널</option><option>기타</option></select></label>
 <label>마감일<input type="date" id="nf_due"></label></div><button class="p" onclick="addFac()">추가</button>`}
function addFac(){const n=$("#nf_name").value.trim();if(!n)return toast("시설물명을 입력하세요");S.facilities.push({id:uid(),name:n,type:$("#nf_type").value,due:$("#nf_due").value,stage:[0,0,0,0,0,0],checks:{},memo:""});save();render()}
function toggleStage(id,i){const f=S.facilities.find(x=>x.id===id);f.stage[i]=f.stage[i]?0:1;save();render()}

/* ===== 시설물 상세 ===== */
function vFac(){
  if(!S.facilities.length)return `<h2>시설물</h2><div class="card">시설물이 없습니다. 홈에서 추가하세요.</div>`;
  if(!S.facilities.find(f=>f.id===S.ui.sel))S.ui.sel=S.facilities[0].id;
  const f=S.facilities.find(x=>x.id===S.ui.sel);
  const opts=S.facilities.map(x=>`<option value="${x.id}" ${x.id===f.id?"selected":""}>${esc(x.name)}</option>`).join("");
  const chk=SITE_CHECK.map((c,i)=>`<label class="chk" style="flex-direction:row;color:var(--ink);font-size:inherit"><input type="checkbox" ${f.checks[i]?"checked":""} onchange="setCheck('${f.id}',${i},this.checked)"><span>${esc(c)}</span></label>`).join("");
  const cl=S.closures.filter(c=>c.fid===f.id).length, ts=S.tests.filter(t=>t.fid===f.id).length;
  return `<h2>시설물 상세</h2>
  <div class="row"><label>시설물<select onchange="S.ui.sel=this.value;save();render()">${opts}</select></label></div>
  <div class="grid">
   <div class="card"><h3>기본 정보</h3>
    <div class="row"><label>이름<input value="${esc(f.name)}" onchange="upFac('${f.id}','name',this.value)"></label>
    <label>구분<select onchange="upFac('${f.id}','type',this.value)">${["교량","터널","기타"].map(t=>`<option ${f.type===t?"selected":""}>${t}</option>`).join("")}</select></label></div>
    <div class="row"><label>마감일<input type="date" value="${esc(f.due)}" onchange="upFac('${f.id}','due',this.value)"></label></div>
    <div class="steps">${STAGES.map((s,i)=>`<i class="${f.stage[i]?"on":""}" title="${s}" onclick="toggleStage('${f.id}',${i})"></i>`).join("")}</div>
    <div class="muted">${STAGES.map((s,i)=>f.stage[i]?`<b>${s}</b>`:s).join(" · ")}</div>
    <div class="row"><label>메모<textarea onchange="upFac('${f.id}','memo',this.value)">${esc(f.memo)}</textarea></label></div>
    <button class="d" onclick="delFac('${f.id}')">시설물 삭제</button></div>
   <div class="card"><h3>현장 출발 전 체크</h3>${chk}</div>
   <div class="card"><h3>연결된 준비 항목</h3><p>도로차단 계획 ${cl}건 · 시험의뢰 ${ts}건</p>
    <button onclick="prepTab='close';go('prep')">도로차단</button> <button onclick="prepTab='test';go('prep')">시험의뢰</button></div>
  </div>`;
}
function upFac(id,k,v){S.facilities.find(f=>f.id===id)[k]=v;save()}
function setCheck(id,i,v){S.facilities.find(f=>f.id===id).checks[i]=v;save()}
function delFac(id){if(!confirm("이 시설물과 연결된 데이터는 유지되지만 시설물 항목은 삭제됩니다. 삭제할까요?"))return;S.facilities=S.facilities.filter(f=>f.id!==id);S.ui.sel=null;save();render()}

/* ===== 계산·판정 ===== */
function vCalc(){
  const tabs=[["rebound","반발경도"],["carb","탄산화"],["crack","균열폭"],["qty","손상물량"],["rate","상태평가 산정"]];
  const body={rebound:cRebound,carb:cCarb,crack:cCrack,qty:cQty,rate:cRate}[calcTab]();
  return `<h2>계산·판정</h2><div class="tabs">${tabs.map(([k,n])=>`<button class="${calcTab===k?"on":""}" onclick="calcTab='${k}';render()">${n}</button>`).join("")}</div>${body}`;
}
function cv(k,d=""){return S.cal[k]??d}
function setCal(k,v){S.cal[k]=v;save()}
function cRebound(){
  const g=Array.from({length:20},(_,i)=>`<input type="number" step="0.5" id="rb${i}" value="${esc(cv("rb"+i))}" oninput="setCal('rb${i}',this.value)" placeholder="${i+1}">`).join("");
  return `<div class="card"><h3>반발경도 강도 추정 (20점)</h3>
  <div class="note">평균 ±20% 초과 값은 제외하고 재평균하며, 제외가 4개를 초과하면 재시험 대상으로 표시합니다. 강도 환산식은 기준마다 다르므로 계수를 직접 입력하세요. <span class="tag warn">환산식·계수 확인 필요</span></div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px">${g}</div>
  <div class="row"><label>타격 방향 보정 ΔR<input type="number" step="0.1" id="rbd" value="${esc(cv("rbd","0"))}" oninput="setCal('rbd',this.value)"></label>
  <label>재령(일)<input type="number" id="rbage" value="${esc(cv("rbage"))}" oninput="setCal('rbage',this.value)"></label>
  <label>재령 보정계수<input type="number" step="0.01" id="rbk" value="${esc(cv("rbk","1"))}" oninput="setCal('rbk',this.value)"></label></div>
  <div class="row"><label>환산식: 강도 = a × R + b<span class="muted">a, b를 사용 지침 값으로 입력</span></label>
  <label>a<input type="number" step="any" id="rba" value="${esc(cv("rba"))}" oninput="setCal('rba',this.value)"></label>
  <label>b<input type="number" step="any" id="rbb" value="${esc(cv("rbb"))}" oninput="setCal('rbb',this.value)"></label></div>
  <div class="row"><button class="p" onclick="calcRebound()">계산</button><button onclick="clearRebound()">초기화</button></div><div class="res" id="rbres">-</div></div>`;
}
function calcRebound(){
  let v=[];for(let i=0;i<20;i++){const n=num($("#rb"+i).value);if(n!==null)v.push(n)}
  if(v.length<2)return $("#rbres").textContent="측정값을 입력하세요";
  const m=v.reduce((a,b)=>a+b,0)/v.length;const keep=v.filter(x=>Math.abs(x-m)<=0.2*m);const ex=v.length-keep.length;
  const m2=keep.reduce((a,b)=>a+b,0)/keep.length;const dR=num($("#rbd").value)||0;const R=m2+dR;
  const a=num($("#rba").value),b=num($("#rbb").value),k=num($("#rbk").value)||1;
  let t=`측정 ${v.length}점 · 1차 평균 ${m.toFixed(2)} · 제외 ${ex}점 · 보정 평균 R=${R.toFixed(2)}`;
  if(ex>4)t+=" ⚠ 제외 4점 초과: 재시험 필요";
  if(a!==null&&b!==null)t+=` · 추정강도 ${((a*R+b)*k).toFixed(2)} (a,b,보정계수 적용)`;else t+=" · (a, b 입력 시 강도 산출)";
  $("#rbres").textContent=t;
}
function clearRebound(){for(let i=0;i<20;i++){$("#rb"+i).value="";delete S.cal["rb"+i]}save();$("#rbres").textContent="-"}
function cCarb(){return `<div class="card"><h3>탄산화 진행 예측 (C = A√t)</h3>
 <div class="row"><label>측정 탄산화 깊이 C (mm)<input type="number" step="0.1" id="cc" value="${esc(cv("cc"))}" oninput="setCal('cc',this.value)"></label>
 <label>경과년수 t (년)<input type="number" step="0.1" id="ct" value="${esc(cv("ct"))}" oninput="setCal('ct',this.value)"></label>
 <label>철근 피복두께 (mm)<input type="number" step="0.1" id="ccv" value="${esc(cv("ccv"))}" oninput="setCal('ccv',this.value)"></label></div>
 <div class="row"><button class="p" onclick="calcCarb()">계산</button></div><div class="res" id="cres">-</div></div>`}
function calcCarb(){const C=num($("#cc").value),t=num($("#ct").value),cv_=num($("#ccv").value);
 if(!C||!t)return $("#cres").textContent="깊이와 경과년수를 입력하세요";
 const A=C/Math.sqrt(t);let s=`속도계수 A = ${A.toFixed(3)} mm/√년`;
 if(cv_){const T=Math.pow(cv_/A,2);s+=` · 피복(${cv_}mm) 도달 약 ${T.toFixed(1)}년 · 잔여 약 ${Math.max(0,T-t).toFixed(1)}년`}
 $("#cres").textContent=s}

 return `<div class="card"><h3>균열폭 등급 판정</h3>
 <div class="note">경계값은 구조물 종류·환경 조건에 따라 지침마다 다릅니다. 아래 기본값은 임시 예시이므로 사용 지침 값으로 수정하세요. <span class="tag warn">확인 필요</span></div>
 <div class="row">${b}</div><div class="row"><label>측정 균열폭 (mm)<input type="number" step="0.01" id="cw" value="${esc(cv("cw"))}" oninput="setCal('cw',this.value)"></label></div>
 <div class="row"><button class="p" onclick="calcCrack()">판정</button></div><div class="res" id="cwres">-</div></div>`}
function calcCrack(){const w=num($("#cw").value);if(w===null)return $("#cwres").textContent="균열폭을 입력하세요";
 const a=["a","b","c","d"].map(k=>num($("#cb"+k).value));const g=["A","B","C","D","E"];let i=0;while(i<4&&a[i]!==null&&w>a[i])i++;
 $("#cwres").textContent=`균열폭 ${w}mm → 구간 ${g[i]} (경계 ${a.join(" / ")})`}
function cQty(){

 if(!sw)return $("#rateres").textContent="점수와 가중치를 입력하세요";const m=ss/sw;const t=["Ta","Tb","Tc","Td"].map(k=>num(cv(k)));const g=["A","B","C","D"];let r="E";for(let i=0;i<4;i++)if(t[i]!==null&&m>=t[i]){r=g[i];break}

 <button class="d" onclick="if(confirm('삭제할까요?')){S.tools.splice(${i},1);save();render()}">삭제</button></div></div>`).join("");
 return `<h2>자동화 도구함</h2>
 <div class="note">웹페이지는 보안상 PC의 .exe/.py를 직접 실행할 수 없습니다. 이 화면에서는 경로·명령 관리와 복사까지 하고, 바로 실행이 필요하면 별도 PC 런처를 추가하는 방식으로 확장합니다. 웹 실행형·외부 링크는 바로 열립니다.</div>
 <div class="grid">${cards}<div class="card"><h3>+ 도구 슬롯 추가</h3>
 <div class="row"><label>이름<input id="tn"></label><label>종류<select id="tt">${Object.entries(TYPE_NAME).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label></div>
 <div class="row"><label>실행 방법(경로·명령·URL)<input id="tr"></label></div>
 <div class="row"><label>입력 형식<input id="ti"></label><label>출력 형식<input id="to"></label><label>버전<input id="tv" value="1.0"></label></div>
 <div class="row"><label>사용법 메모<input id="tm"></label></div><button class="p" onclick="addTool()">추가</button></div></div>`}
function addTool(){const n=$("#tn").value.trim();if(!n)return toast("이름을 입력하세요");S.tools.push({name:n,type:$("#tt").value,run:$("#tr").value,in:$("#ti").value,out:$("#to").value,version:$("#tv").value,memo:$("#tm").value});save();render()}

/* ===== 자료실 ===== */
let libQ="";
function vLib(){
 const q=libQ.toLowerCase();const list=S.snippets.map((s,i)=>({...s,i})).filter(s=>!q||(s.cat+s.title+s.text).toLowerCase().includes(q));
 const cats=[...new Set(list.map(s=>s.cat))];
 const body=cats.map(c=>`<h3 style="margin-top:12px">${esc(c)}</h3><div class="grid">${list.filter(s=>s.cat===c).map(s=>`<div class="card"><b>${esc(s.title)}</b><p>${esc(s.text)}</p><div class="row"><button class="p" onclick="copy(S.snippets[${s.i}].text)">복사</button><button class="d" onclick="S.snippets.splice(${s.i},1);save();render()">삭제</button></div></div>`).join("")}</div>`).join("");
 return `<h2>자료실 · 자주 쓰는 문구</h2>
 <div class="row"><label>검색<input value="${esc(libQ)}" oninput="libQ=this.value;render();const e=$('#app input');e.focus();e.setSelectionRange(libQ.length,libQ.length)"></label></div>
 ${body||'<div class="card">문구가 없습니다.</div>'}
 <div class="card" style="margin-top:12px"><h3>+ 문구 추가</h3><div class="row"><label>분류<input id="sc" placeholder="손상 설명 / 보수·보강 / 기타"></label><label>제목<input id="st"></label></div>
 <div class="row"><label>내용<textarea id="sx"></textarea></label></div><button class="p" onclick="addSnip()">추가</button></div>
 <div class="card" style="margin-top:12px"><h3>참고 링크</h3><div class="row">
 <a href="https://www.law.go.kr" target="_blank" rel="noopener">국가법령정보센터</a> · <a href="https://www.fms.go.kr" target="_blank" rel="noopener">FMS</a> · <a href="https://www.molit.go.kr" target="_blank" rel="noopener">국토교통부</a></div>
 <div class="muted">세부지침·교통관리지침 등 PDF는 직접 보관하는 위치를 메모로 적어 두세요(문구 추가에 "경로" 분류로 저장 가능).</div></div>`}
function addSnip(){const t=$("#st").value.trim(),x=$("#sx").value.trim();if(!t||!x)return;S.snippets.push({cat:$("#sc").value.trim()||"기타",title:t,text:x});save();render()}

/* ===== 설정 ===== */
function vSet(){return `<h2>설정 · 백업</h2><div class="grid">
 <div class="card"><h3>백업/복원 (JSON)</h3><p class="muted">시설물·차단·시험의뢰·도구·문구를 모두 포함합니다. 주기적으로 저장해 두세요.</p>
 <div class="row"><button class="p" onclick="download('작업대_백업_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,1))">백업 저장</button>
 <label style="flex:0"><input type="file" accept=".json" onchange="restore(this.files[0])"></label></div></div>
 <div class="card"><h3>도구 목록(JSON) 편집</h3><p class="muted">tools 배열을 JSON으로 직접 수정합니다.</p>
 <textarea id="tj" style="min-height:160px;font-family:monospace;font-size:12px">${esc(JSON.stringify(S.tools,null,1))}</textarea>
 <button class="p" onclick="saveTools()">적용</button></div>
 <div class="card"><h3>초기화</h3><button class="d" onclick="if(confirm('모든 데이터를 삭제합니다. 계속할까요?')){localStorage.removeItem(KEY);S=base();render()}">전체 데이터 삭제</button></div></div>`}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(base(),JSON.parse(r.result));save();render();toast("복원됨")}catch(e){alert("올바른 백업 파일이 아닙니다")}};r.readAsText(f)}
function saveTools(){try{const t=JSON.parse($("#tj").value);if(!Array.isArray(t))throw 0;S.tools=t;save();toast("적용됨")}catch(e){alert("JSON 형식 오류")}}

/* ===== PWA(설치형) 매니페스트 — 단일 파일용 간이 구성 ===== */
try{const m={name:"안전진단 작업대",short_name:"작업대",display:"standalone",start_url:location.href,background_color:"#1f3a5f",theme_color:"#1f3a5f"};
 const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l)}catch(e){}
render();
</script>
</body>
</html>
