<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>초음파 강도추정</title><link rel="stylesheet" href="../common.css"></head>
<body data-pid="ultrasonic">
<h1>초음파 강도추정</h1><div class="sub">초음파 전달시간과 거리로 전달속도를 구하고, 입력한 계수로 강도를 환산합니다.</div>

<div class="card">
  <label>위치 / 메모<input id="loc" placeholder="예: P1 기둥 / 거더 웹"></label>
  <div class="row">
    <label>측정 거리 L (mm)<input id="L" inputmode="decimal"></label>
  </div>
  <div id="rd"></div>
  <div class="muted">전달시간은 μs 단위로 입력합니다. 여러 번 측정하면 평균 속도를 사용합니다. (V = L / T, mm/μs = km/s)</div>

  <div class="note">강도 환산식은 기준·시험체마다 다릅니다. 사용하는 환산식의 형태를 고르고 계수를 입력하세요. 환산식이 정해지지 않았다면 속도만 표시됩니다. <span class="tag">계수 확인 필요</span></div>
  <div class="row">
    <label>환산식 형태
      <select id="m">
        <option value="lin">f = a·V + b</option>
        <option value="exp">f = a·e^(b·V)</option>
        <option value="pow">f = a·V^b</option>
        <option value="son">f = a·V^b·R^c (반발경도 복합)</option>
      </select></label>
    <label>a<input id="ca" inputmode="decimal"></label>
    <label>b<input id="cb" inputmode="decimal"></label>
    <label id="lc" style="display:none">c<input id="cc" inputmode="decimal"></label>
    <label id="lr" style="display:none">반발경도 R<input id="rv" inputmode="decimal"></label>
    <label>강도 단위<input id="un" placeholder="MPa"></label>
  </div>
  <div class="res" id="res">값을 입력하세요</div>
  <div class="row"><button class="p" id="save">기록 저장</button></div>
</div>
<div class="card" id="log"></div>

<script src="../common.js"></script>
<script>
let last = null;
function calc() {
  const mode = WB.$("#m").value; WB.$("#lc").style.display = WB.$("#lr").style.display = mode === "son" ? "" : "none";
  const L = WB.num(WB.$("#L").value), T = rd.get(), R = WB.$("#res"); last = null;
  if (!L || !T.length) { R.textContent = "거리 L과 전달시간을 입력하세요"; return; }
  const vs = T.filter(t => t > 0).map(t => L / t); if (!vs.length) { R.textContent = "전달시간은 0보다 커야 합니다"; return; }
  const V = vs.reduce((a, b) => a + b, 0) / vs.length;
  let html = `전달속도 V = ${V.toFixed(3)} km/s`, f = null, un = WB.$("#un").value || "";
  const a = WB.num(WB.$("#ca").value), b = WB.num(WB.$("#cb").value), c = WB.num(WB.$("#cc").value), r = WB.num(WB.$("#rv").value);
  if (mode === "lin" && a !== null && b !== null) f = a * V + b;
  if (mode === "exp" && a !== null && b !== null) f = a * Math.exp(b * V);
  if (mode === "pow" && a !== null && b !== null) f = a * Math.pow(V, b);
  if (mode === "son" && a !== null && b !== null && c !== null && r !== null) f = a * Math.pow(V, b) * Math.pow(r, c);
  if (f !== null && isFinite(f)) html += `<br>추정강도 ≈ ${f.toFixed(2)} ${un}`;
  const sub = `${vs.length}회 측정` + (f === null ? " · 계수 입력 시 강도 산출" : "");
  last = [L, vs.length, V.toFixed(3), f !== null && isFinite(f) ? f.toFixed(2) : ""];
  R.innerHTML = html + `<small>${sub}</small>`;
}
const rd = WB.readings(WB.$("#rd"), "t", { label: "전달시간 T (μs)", onChange: () => calc() });
WB.bind(["loc", "L", "m", "ca", "cb", "cc", "rv", "un"], calc);
WB.log.mount("#log", ["L(mm)", "횟수", "V(km/s)", "추정강도"]);
WB.$("#save").onclick = () => { if (!last) return WB.toast("측정값이 없습니다"); WB.log.add(last); rd.clear(); };
calc();
</script></body></html>
