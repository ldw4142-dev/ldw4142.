<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>균열깊이</title><link rel="stylesheet" href="../common.css"></head>
<body data-pid="crackdepth">
<h1>균열깊이</h1><div class="sub">초음파 전달시간으로 균열깊이를 산정합니다 (Tc-To 방법).</div>

<div class="card">
  <label>위치 / 메모<input id="loc" placeholder="예: 슬래브 하면 균열 C-12"></label>
  <div class="note">균열을 가운데 두고 탐촉자를 좌우 대칭으로 놓았을 때 <b>h = x · √((Tc/To)² − 1)</b> 로 계산합니다.
   x: 균열에서 각 탐촉자까지의 거리(탐촉자 간격의 1/2), Tc: 균열을 가로지른 전달시간, To: 같은 간격(2x)의 건전부 전달시간.
   적용 조건(균열 방향 철근, 균열 내 수분, 탐촉자 간격 등)은 사용 지침에서 확인하세요. <span class="tag">조건 확인 필요</span></div>
  <div class="row">
    <label>x (mm)<input id="x" inputmode="decimal" placeholder="탐촉자~균열 거리"></label>
    <label>Tc (μs)<input id="tc" inputmode="decimal" placeholder="균열 가로지름"></label>
    <label>To (μs)<input id="to" inputmode="decimal" placeholder="건전부"></label>
  </div>
  <div class="res" id="res">값을 입력하세요</div>
  <div class="row"><button class="p" id="save">기록 저장</button><button id="clr">입력 비우기</button></div>
</div>
<div class="card" id="log"></div>

<script src="../common.js"></script>
<script>
let last = null;
function calc() {
  const x = WB.num(WB.$("#x").value), tc = WB.num(WB.$("#tc").value), to = WB.num(WB.$("#to").value), R = WB.$("#res");
  last = null;
  if (x === null || tc === null || to === null) { R.textContent = "x, Tc, To를 입력하세요"; return; }
  if (to <= 0 || x <= 0) { R.textContent = "x와 To는 0보다 커야 합니다"; return; }
  if (tc <= to) { R.innerHTML = `Tc ≤ To<small>균열의 영향이 없거나 측정 오류입니다. 재측정하세요.</small>`; return; }
  const h = x * Math.sqrt((tc / to) ** 2 - 1);
  last = [x, tc, to, h.toFixed(1)];
  R.innerHTML = `균열깊이 h ≈ ${h.toFixed(1)} mm<small>Tc/To = ${(tc / to).toFixed(3)}</small>`;
}
WB.bind(["loc", "x", "tc", "to"], calc);
WB.log.mount("#log", ["x(mm)", "Tc(μs)", "To(μs)", "깊이 h(mm)"]);
WB.$("#save").onclick = () => { if (!last) return WB.toast("계산 결과가 없습니다"); WB.log.add(last); };
WB.$("#clr").onclick = () => { ["tc", "to"].forEach(i => { WB.$("#" + i).value = ""; WB.set("f_" + i, ""); }); calc(); WB.$("#tc").focus(); };
calc();
</script></body></html>
