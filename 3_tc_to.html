<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>균열깊이 추정기 (Tc-To 법)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
  <div class="max-w-4xl mx-auto p-4 sm:p-6 md:p-8 space-y-5">
    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <a href="../index.html" class="h-11 px-4 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-sm font-bold flex items-center">← 작업대 홈</a>
          <div>
            <span class="text-xs font-semibold text-slate-500">현장조사·비파괴</span>
            <h1 class="text-lg sm:text-xl font-bold">📏 균열깊이 추정기 (초음파 Tc-To 법)</h1>
          </div>
        </div>
        <button onclick="window.open(location.href, '_blank')" class="h-11 px-3.5 rounded-lg border border-slate-300 dark:border-slate-700 text-sm font-medium">새 창 열기 ↗</button>
      </div>
      <div class="p-3.5 rounded-xl bg-blue-50/70 dark:bg-blue-950/40 border border-blue-100 dark:border-blue-900 text-xs sm:text-sm">
        ℹ️ <strong>적용 식 (BS 1881 / 초음파 표면주사 Tc-To 법):</strong> 균열 중심 양측 탐촉자 거리 각 $L$ ($\text{mm}$)일 때, 추정 균열깊이 $h = L \times \sqrt{(T_c / T_o)^2 - 1}$ ($\text{mm}$)
      </div>
    </div>

    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm space-y-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1.5">균열 번호 / 위치</label>
          <input type="text" id="crackId" value="C-01 (P1 교각 하단 수직균열)" oninput="calc()" class="w-full h-12 px-4 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
        </div>
        <div>
          <label class="block text-sm font-bold mb-1.5">균열 중심~탐촉자 거리 L (mm)</label>
          <input type="number" inputmode="decimal" step="1" id="distL" value="100" oninput="calc()" class="w-full h-12 px-4 text-lg font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
        </div>
        <div>
          <label class="block text-sm font-bold mb-1.5">건전부 전달시간 To (μs)</label>
          <input type="number" inputmode="decimal" step="0.1" id="to" value="48.5" oninput="calc()" class="w-full h-12 px-4 text-lg font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
        </div>
        <div>
          <label class="block text-sm font-bold mb-1.5">균열부 전달시간 Tc (μs)</label>
          <input type="number" inputmode="decimal" step="0.1" id="tc" value="62.0" oninput="calc()" class="w-full h-12 px-4 text-lg font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800" />
        </div>
      </div>

      <div class="p-5 rounded-xl bg-slate-100 dark:bg-slate-800 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="bg-white dark:bg-slate-900 p-4 rounded-xl">
            <p class="text-xs text-slate-500">전달시간 비 (Tc / To)</p>
            <p id="out-ratio" class="text-2xl font-bold mt-1">1.28</p>
          </div>
          <div class="bg-white dark:bg-slate-900 p-4 rounded-xl">
            <p class="text-xs text-slate-500">건전부 초음파속도 (2L/To)</p>
            <p id="out-vp" class="text-2xl font-bold mt-1">4,124 m/s</p>
          </div>
          <div class="bg-[#1E3A8A] text-white p-4 rounded-xl">
            <p class="text-xs text-blue-200">추정 균열깊이 (h)</p>
            <p id="out-depth" class="text-2xl font-extrabold mt-1">79.6 mm</p>
          </div>
        </div>

        <div class="flex flex-wrap gap-2 pt-3 border-t border-slate-200 dark:border-slate-700">
          <button onclick="copyResult()" class="h-12 px-4 rounded-lg bg-[#1E3A8A] text-white font-semibold text-sm">📋 보고서용 결과 복사</button>
          <button onclick="downloadCSV()" class="h-12 px-4 rounded-lg bg-emerald-700 text-white font-semibold text-sm">📥 엑셀(CSV) 저장</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('wb_dark') === 'true') document.documentElement.classList.add('dark');
    const KEY = 'tool_crack_depth_v1';

    function calc() {
      const crackId = document.getElementById('crackId').value;
      const distL = parseFloat(document.getElementById('distL').value) || 0;
      const to = parseFloat(document.getElementById('to').value) || 0;
      const tc = parseFloat(document.getElementById('tc').value) || 0;

      const ratio = to > 0 ? tc / to : 0;
      const depth = ratio > 1 ? distL * Math.sqrt(Math.pow(ratio, 2) - 1) : 0;
      const vp = to > 0 ? ((2 * distL) / to) * 1000 : 0;

      document.getElementById('out-ratio').textContent = ratio.toFixed(2);
      document.getElementById('out-vp').textContent = Math.round(vp).toLocaleString() + ' m/s';
      document.getElementById('out-depth').textContent = depth.toFixed(1) + ' mm';

      localStorage.setItem(KEY, JSON.stringify({ crackId, distL, to, tc }));
      window._last = { crackId, distL, to, tc, ratio, depth };
    }

    function copyResult() {
      const x = window._last;
      navigator.clipboard.writeText(`[균열깊이 추정] 위치: ${x.crackId} | L=${x.distL}mm | To=${x.to}μs | Tc=${x.tc}μs | 추정균열깊이 h = ${x.depth.toFixed(1)} mm`);
      alert('보고서용 텍스트가 복사되었습니다.');
    }

    function downloadCSV() {
      const x = window._last;
      const csv = `\uFEFF균열위치,탐촉자거리L(mm),건전부To(us),균열부Tc(us),추정균열깊이(mm)\n${x.crackId},${x.distL},${x.to},${x.tc},${x.depth.toFixed(1)}`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      a.download = `균열깊이_${x.crackId}.csv`;
      a.click();
    }

    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved) {
      document.getElementById('crackId').value = saved.crackId;
      document.getElementById('distL').value = saved.distL;
      document.getElementById('to').value = saved.to;
      document.getElementById('tc').value = saved.tc;
    }
    calc();
  </script>
</body>
</html>
