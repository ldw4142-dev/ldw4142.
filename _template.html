<!DOCTYPE html>
<!-- 새 프로그램 템플릿
  1) 이 파일을 복사해 programs/ 폴더에 새 이름으로 저장 (예: mytool.html)
  2) <body data-pid="..."> 의 값을 고유한 영문 id로 바꿈 (저장 데이터가 이 id로 구분됨)
  3) programs.js 에 한 덩어리 추가:
     { id: "mytool", name: "내 프로그램", category: "분류", type: "web", file: "programs/mytool.html", desc: "설명", version: "1.0" }
  사용 가능한 도구(common.js):
     WB.get(키, 기본값) / WB.set(키, 값)   프로그램별 저장·불러오기
     WB.bind(["id1","id2"], 콜백)          입력칸 값 자동 저장·복원
     WB.readings(요소, 키, {label, max, onChange})   측정값 연속 입력
     WB.log.mount("#log", ["열1"]) / WB.log.add(["값"])   측정 기록(복사·CSV)
     WB.copy(텍스트) / WB.toast(메시지) / WB.num(문자열)
-->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>새 프로그램</title><link rel="stylesheet" href="../common.css"></head>
<body data-pid="template">
<h1>새 프로그램</h1><div class="sub">여기에 설명을 적으세요.</div>

<div class="card">
  <label>위치 / 메모<input id="loc"></label>
  <div class="row"><label>입력값<input id="v" inputmode="decimal"></label></div>
  <div class="res" id="res">값을 입력하세요</div>
  <div class="row"><button class="p" id="save">기록 저장</button></div>
</div>
<div class="card" id="log"></div>

<script src="../common.js"></script>
<script>
let last = null;
function calc() {
  const v = WB.num(WB.$("#v").value); last = null;
  if (v === null) { WB.$("#res").textContent = "값을 입력하세요"; return; }
  const out = v * 2;                       // ← 여기에 계산식을 넣으세요
  last = [v, out];
  WB.$("#res").textContent = "결과: " + out;
}
WB.bind(["loc", "v"], calc);
WB.log.mount("#log", ["입력", "결과"]);
WB.$("#save").onclick = () => { if (!last) return WB.toast("결과가 없습니다"); WB.log.add(last); };
calc();
</script></body></html>
