<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>탄산화</title><link rel="stylesheet" href="../common.css"></head>
<body data-pid="carbonation">
<h1>탄산화</h1><div class="sub">탄산화 깊이로 속도계수 A와 철근 위치 도달 시기를 계산합니다 (C = A√t).</div>

<div class="card">
  <label>위치 / 메모<input id="loc" placeholder="예: P2 기둥 코어 #1"></label>
  <div id="rd"></div>
  <div class="row">
    <label>경과년수 t (년)<input id="t" inputmode="decimal" placeholder="준공 후 경과"></label>
    <label>철근 피복두께 (mm)<input id="cv" inputmode="decimal"></label>
    <label>예측 시점 (년, 선택)<input id="tt" inputmode="decimal" placeholder="예: 50"></label>
  </div>
  <div class="res" id="res">값을 입력하세요</div>
  <div class="note">√t 법칙에 따른 단순 예측입니다. 환경 조건·마감재·피복 상태에 따라 실제와 차이가 있을 수 있으니 판정은 지침 기준으로 확인하세요.</div>
  <div class="row"><button class="p" id="save">기록 저장</button></div>
</div>
<div class="card" id="log"></div>

<script src="../common.js"></script>
<script>
let last = null;
function calc() {
  const d = rd.get(), t = WB.num(WB.$("#t").value), cv = WB.num(WB.$("#cv").value), tt = WB.num(WB.$("#tt").value), R = WB.$("#res");
  last = null;
  if (!d.length) { R.textContent = "탄산화 깊이를 입력하세요"; return; }
  const C = d.reduce((a, b) => a + b, 0) / d.length;
  let html = `평균 깊이 C = ${C.toFixed(1)} mm`, sub = `${d.length}개 측정 (최대 ${Math.max(...d)} / 최소 ${Math.min(...d)})`, A = "", T = "", rem = "";
  if (t && t > 0) {
    const a = C / Math.sqrt(t); A = a.toFixed(3); html += `<br>속도계수 A = ${A} mm/√년`;
    if (cv && cv > 0 && a > 0) {
      const tc = (cv / a) ** 2; T = tc.toFixed(1); rem = Math.max(0, tc - t).toFixed(1);
      html += `<br>피복(${cv}mm) 도달 약 ${T}년 · 잔여 약 ${rem}년`;
      sub += ` · 현재 C/피복 = ${(C / cv * 100).toFixed(0)}%`;
    }
    if (tt && tt > 0) html += `<br>${tt}년 시점 예측 깊이 ≈ ${(a * Math.sqrt(tt)).toFixed(1)} mm`;
  } else sub += " · 경과년수 입력 시 A 산정";
  last = [d.length, C.toFixed(1), A, T, rem];
  R.innerHTML = html + `<small>${sub}</small>`;
}
const rd = WB.readings(WB.$("#rd"), "c", { label: "탄산화 깊이 (mm)", onChange: () => calc() });
WB.bind(["loc", "t", "cv", "tt"], calc);
WB.log.mount("#log", ["개수", "평균 C(mm)", "A", "도달(년)", "잔여(년)"]);
WB.$("#save").onclick = () => { if (!last) return WB.toast("측정값이 없습니다"); WB.log.add(last); rd.clear(); };
calc();
</script></body></html>
