<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내집마련 정보 입력 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  /* layout: one column, sticky progress bar, accordion inputs, then live judgement panels */
  --bg:#f3f6f5; --surface:#ffffff; --ink:#1a2421; --muted:#5a6a65; --line:#d6dfdc;
  --accent:#1d6b58; --accent-ink:#ffffff; --soft:#e2efeb; --warn:#8f4a12; --warnbg:#fbece0;
  --danger:#a32a2a; --okbg:#dcefe8; --tribg:#f8ecc9; --tri:#7a5a05; --nobg:#f6dcdc;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121917; --surface:#1b2421; --ink:#e6eeeb; --muted:#9db0aa; --line:#2f3d39;
    --accent:#58b79e; --accent-ink:#0c1512; --soft:#22342f; --warn:#f0b27a; --warnbg:#33261a;
    --danger:#ff9a9a; --okbg:#1f3a32; --tribg:#3b3216; --tri:#f0d27a; --nobg:#412222; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121917; --surface:#1b2421; --ink:#e6eeeb; --muted:#9db0aa; --line:#2f3d39;
  --accent:#58b79e; --accent-ink:#0c1512; --soft:#22342f; --warn:#f0b27a; --warnbg:#33261a;
  --danger:#ff9a9a; --okbg:#1f3a32; --tribg:#3b3216; --tri:#f0d27a; --nobg:#412222; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
header.top .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-size:19px;margin:0;font-weight:700;text-wrap:balance}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.bar{height:8px;background:var(--soft);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.pct{font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.notice{margin:14px 0;padding:12px 14px;background:var(--warnbg);color:var(--warn);border-radius:10px;font-size:14px}
.notice b{display:block;margin-bottom:2px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:10px 0}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;min-height:52px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:6px;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
.badge{font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--accent);font-variant-numeric:tabular-nums;margin-left:auto}
.badge.done{background:var(--accent);color:var(--accent-ink)}
.sbody{padding:2px 16px 16px;display:grid;gap:12px}
.grid2{display:grid;gap:12px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.fld{display:grid;gap:5px;font-size:14px}
.fld>span{color:var(--muted);font-weight:500}
.in{display:flex;align-items:center;gap:8px}
.in em{font-style:normal;color:var(--muted);font-size:14px;white-space:nowrap}
input[type=text],input[type=date],input[type=month],select,textarea{width:100%;max-width:100%;min-width:0;min-height:48px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none}
input[type=range]{width:100%;accent-color:var(--accent);min-height:36px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:0}
.rowcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.rowcard .grid2{gap:10px}
.todo{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.todo input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
.todo .sub{grid-column:1/-1;display:flex;gap:8px}
.todo.done input[type=text]{text-decoration:line-through;color:var(--muted)}
button{font:inherit;min-height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.small{min-height:40px;padding:0 12px;font-size:14px}
button.del{color:var(--danger)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile small{display:block;color:var(--muted);font-size:12px}
.tile b{font-size:17px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--muted);display:block}
.actions{display:grid;gap:10px;margin:14px 0}
@media (min-width:640px){.actions.three{grid-template-columns:repeat(3,1fr)}}
.out{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.out textarea{min-height:320px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
.msg{font-size:14px;color:var(--accent);min-height:22px;margin:6px 0}
.msg.err{color:var(--danger)}
.confirm{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:12px;display:grid;gap:10px}
.confirm .btns{display:flex;gap:8px;flex-wrap:wrap}
h2{font-size:16px;margin:26px 0 4px}
.sr{position:absolute;left:-9999px}
/* judgement */
.mk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:99px;font-weight:700;font-size:14px;flex:none}
.mk.o{background:var(--okbg);color:var(--accent)}
.mk.t{background:var(--tribg);color:var(--tri)}
.mk.x{background:var(--nobg);color:var(--danger)}
.mk.n{background:var(--soft);color:var(--muted)}
.jcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.jcard h3{margin:0;font-size:15px}
.jcols{display:grid;gap:10px}
details.jl{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;margin:8px 0 0}
details.jl>summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-height:36px;list-style:none}
details.jl>summary::-webkit-details-marker{display:none}
details.jl .why{margin-top:8px}
.mkb{min-width:44px;min-height:44px;padding:0;border:0;background:none;position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:10px}
.mkb::after{content:'';position:absolute;right:5px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.8}
.mkb[aria-expanded=true]{outline:2px solid var(--accent)}
#pop{position:fixed;z-index:1000;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.35);padding:12px;overflow:auto;font-size:13px;display:none}
#pop .phd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
#pop .pclose{min-height:44px;min-width:44px;padding:0;font-size:20px;line-height:1;flex:none;margin:-8px -8px 0 0}
#pop .pnote{margin:0 0 8px;padding:6px 8px;border-radius:8px;background:var(--tribg);color:var(--tri);font-size:12px}
#pop details summary{cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--muted)}
#pop .ex{margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line,#e5e5e5)}
#pop .ex p{margin:0 0 6px;line-height:1.55}
#pop .exh{display:flex;gap:6px;font-size:15px}
#pop .exs{font-size:12px;color:var(--muted);margin:8px 0 2px;font-weight:600}
#pop .src a{display:inline-block;margin:2px 8px 2px 0}
#pop .pgo{margin-top:10px;width:100%}
.sumtbl th,.sumtbl td{text-align:center}.sumtbl th:first-child,.sumtbl td:first-child{text-align:left}
@media (min-width:640px){.jcols{grid-template-columns:1fr 1fr}}
.jcell{border-radius:8px;padding:10px;background:var(--surface);border:1px solid var(--line)}
.jcell .hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:6px}
.why{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
.why li{display:flex;gap:6px;align-items:flex-start}
.why li .d{flex:none;width:16px;text-align:center;font-weight:700}
.why .l-o .d{color:var(--accent)}.why .l-t .d{color:var(--tri)}.why .l-x .d{color:var(--danger)}.why .l-n .d{color:var(--muted)}
.why .l-n,.why .l-o{color:var(--muted)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tblwrap{overflow-x:auto}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.tbl th{color:var(--muted);font-weight:500;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--accent)}
.pill.warn{background:var(--tribg);color:var(--tri)}
.pill.no{background:var(--nobg);color:var(--danger)}
a{color:var(--accent)}
.src{font-size:12px;color:var(--muted)}
.src a{margin-right:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="row"><h1>내집마련 정보 입력 도우미</h1><span class="saved" id="savedAt">저장 대기</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barWrap"><i id="barFill"></i></div>
    <div class="pct" id="pctTxt">입력 0%</div>
  </header>

  <div class="notice">
    <b>참고용입니다. 실제 자격은 입주자 모집공고문과 기관 심사가 우선합니다.</b>
    모든 판정과 계산은 추정이며, 규정 기준일은 <span id="asOfTxt"></span>입니다. 주민번호·계좌번호·카드번호는 입력하지 마세요. 입력값은 이 기기의 브라우저에만 저장됩니다.
  </div>

  <label class="fld" style="margin-bottom:6px">
    <span>입력 기준일</span>
    <input type="date" id="asOf" data-w="root" data-k="asOf">
  </label>

  <main id="sections"></main>

  <h2>자동 계산 (두 분 합산)</h2>
  <div class="tiles" id="tiles"></div>

  <h2>판정 결과 (추정)</h2>
  <p class="hint">입력을 바꾸면 바로 다시 계산됩니다. ○ 충족 가능, △ 경계선·확인 필요, ✕ 미충족, – 참고.</p>
  <div id="judge"></div>

  <div class="actions">
    <button class="primary" id="btnBuild" type="button">정리본 만들기</button>
  </div>
  <div class="out" id="outBox" hidden>
    <textarea id="outTxt" readonly aria-label="정리본"></textarea>
    <div class="actions" style="margin-bottom:0">
      <button class="primary" id="btnCopy" type="button">복사하기</button>
    </div>
    <div class="msg" id="copyMsg" role="status"></div>
  </div>

  <h2>백업과 초기화</h2>
  <p class="hint">브라우저를 바꾸거나 기록이 지워져도 이어 쓸 수 있게 JSON 파일로 저장해 두세요.</p>
  <div class="actions three">
    <button type="button" id="btnSave">파일로 저장(JSON)</button>
    <button type="button" id="btnLoad">불러오기</button>
    <button type="button" id="btnReset" class="del">초기화</button>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" class="sr" tabindex="-1" aria-label="JSON 파일 선택">
  <div id="resetBox"></div>
  <div class="msg" id="bkMsg" role="status"></div>
</div>

<script>
/* ============================================================
   규정 데이터 RULES (만 원 단위). 값만 바꾸면 판정이 갱신됩니다.
   기준일 2026-11-21. 확인하지 못한 값은 숫자를 넣지 않고 "미확인"으로 둡니다.
   ============================================================ */
const RULES={

  pct:{
    newlywed:{first:[100,120],second:[130,140],entry:[130,200]},   // [외벌이, 맞벌이], 공공주택 특별법 시행규칙 별표 6
    firstTime:{first:[100,120],second:[130,140],entry:[130,200]},

  },

  firstTime:{savings:600,taxYears:5},                         // 국민주택: 저축액 600만 원 이상, 소득세 5년 이상 납부
  cheong:{months:12,count:12},                                // 의정부우정 A-2 공고 기준(블로그 요약). 전형별 공식 수치는 미확인
  didimdol:{newlywed:8500,firstTime:7000,general:6000,maxLoanNewlywed:40000,ltv:0.70,priceCap:50000,netAsset:51100,rateMin:2.40,rateMax:4.15},
  gift:{basic:5000,marriage:10000,windowMonths:24,filingMonths:3,credit:0.03,
        brackets:[[10000,0.10,0],[50000,0.20,1000],[100000,0.30,6000],[300000,0.40,16000],[Infinity,0.50,46000]]},
  acqTax:{cap:200,price:120000,proposedYouthCap:300},
  strat:{refTotal:[1200,1500],monthlyCap:25,woo59:[40419,40646]}   // 사례 당첨선(만 원, 보도), 월 인정 한도(만 원), 의정부우정 A-2 59㎡ 분양가
};
const U={
  lh:{t:'LH 청약플러스 공공분양 안내',u:'https://lh.or.kr/menu.es?mid=a10402010100'},
  law6:{t:'공공주택 특별법 시행규칙 별표 6(개정 2026.6.22)',u:'https://www.law.go.kr/LSW/flDownload.do?flSeq=168411041'},
  first:{t:'생애최초 주택 특별공급 운용지침(국토부고시 제2026-360호)',u:'https://www.law.go.kr/LSW/flDownload.do?flSeq=167007565'},
  r114:{t:'디딤돌대출 소득 기준(리얼터114)',u:'https://r114.com/trends/wiki/finance/34b4a6fa-284b-80dc-9654-dd4cd8e31b2d'},
  kb:{t:'디딤돌대출 순자산 기준(KB Think)',u:'https://kbthink.com/loan/find/didimdol-loan.html'},
  tn:{t:'신혼부부 디딤돌 한도·금리(블로그)',u:'https://www.tndlrs.com/2026/08/newlyweddidimdolloan.html'},
  pre:{t:'신혼부부 예비부부 대출 요건(베이비뉴스)',u:'https://www.ibabynews.com/contents/wedding-newlywed-housing-loans'},
  bogeum:{t:'보금자리론 결혼 페널티 완화(SBS)',u:'https://biz.sbs.co.kr/amp/article/20000337023'},
  dream:{t:'청년 주택드림 대출 조건(KB Think)',u:'https://kbthink.com/loan/find/dream-housing-loan.html'},
  hana:{t:'청년주택드림 연계 요건(하나은행)',u:'https://kebhana.com/cont/mall/mall08/mall0802/mall080203/1420296_115198.jsp'},
  taxdel:{t:'혼인 증여재산공제(세무회계 환희)',u:'https://taxdelight.co.kr/blog/14608/'},
  pwc:{t:'증여세 가이드(삼일PwC)',u:'https://www.pwc.com/kr/ko/insights/issue-brief/samilpwc_gift-tax-parent-child.pdf'},
  rate:{t:'증여세 세율표(법제처 별표)',u:'https://www.law.go.kr/LSW/flDownload.do?flSeq=160317655'},
  taxly:{t:'혼인신고 전 증여와 기한 후 신고(세무사 답변)',u:'https://taxly.kr/qna/144233-혼인신고-전-시부모가-부부-각각에게-증여미신고기한-경과--혼인공제-가능-여부와-신고-시기'},
  acq:{t:'생애최초 취득세 감면(금천구청)',u:'https://www.geumcheon.go.kr/portal/contents.do?key=4561'},
  acq2:{t:'지방세제 개편안 청년 300만 원 확대(MTN)',u:'https://news.mtn.co.kr/news-detail/2026082608593115058'},
  s1:{t:'의정부법조타운 S1블록 기관추천 공지(서울시)',u:'https://news.seoul.go.kr/welfare/archives/584554'},
  s3:{t:'의정부법조타운 S3블록 기관추천 공지(서울시)',u:'https://news.seoul.go.kr/welfare/archives/584559'},
  hgS1:{t:'호갱노노 의정부법조타운S1BL',u:'https://hogangnono.com/apt/gQo3e'},
  hgS3:{t:'호갱노노 의정부법조타운S3',u:'https://hogangnono.com/apt/gMhce'},
  dl:{t:'DL건설 S3BL 수주 기사(매일일보)',u:'http://www.m-i.kr/news/articleView.html?idxno=1318232'},
  woo:{t:'의정부우정 A2블록(당근 부동산)',u:'https://realty.daangn.com/subscriptions/2441'},
  woo2:{t:'의정부우정 A-2 공고 요약(블로그)',u:'https://mhb-blog.com/?p=8948'},
  gob:{t:'의정부 10년 공공임대 무순위(고방)',u:'https://gobang.kr/notices/20794'},

function sanitize(obj){
  const d=blankState();
  if(!obj||typeof obj!=='object')return d;
  if(typeof obj.asOf==='string')d.asOf=obj.asOf;
  ['f','m','sc'].forEach(w=>{
    if(obj[w]&&typeof obj[w]==='object')Object.keys(obj[w]).forEach(k=>{d[w][k]=String(obj[w][k])});
  });
  Object.keys(LISTS).forEach(n=>{
    if(Array.isArray(obj[n])){
      d[n]=obj[n].map(r=>{const o=emptyRow(n);Object.keys(o).forEach(k=>{if(r&&r[k]!=null)o[k]=String(r[k])});return o});
    }
  });
  if(Array.isArray(obj.todo))d.todo=obj.todo.map(t=>({t:String(t&&t.t||''),due:String(t&&t.due||''),done:!!(t&&t.done)}));
  d.noDebt=!!obj.noDebt;d.noSup=!!obj.noSup;d.noDebtM=!!obj.noDebtM;
  return d;
}
const store=(st,w)=>w==='m'?st.m:w==='sc'?st.sc:st.f;

function listFilled(arr){return arr.some(r=>Object.keys(r).some(k=>k!=='done'&&String(r[k]).trim()!==''))}
function filledKey(k,st,w){
  if(k[0]==='@'){
    const n=k.slice(1);
    if(n==='debt')return st.noDebt||listFilled(st.debt);
    if(n==='debtM')return st.noDebtM||listFilled(st.debtM);
    if(n==='sup')return st.noSup||listFilled(st.sup);
    return listFilled(st[n]);
  }
  return has(store(st,w)[k]);
}
function progress(st){
  const secs=SECTIONS.map(s=>({id:s.id,total:s.req.length,done:s.req.filter(k=>filledKey(k,st,s.w)).length}));
  const total=secs.reduce((a,s)=>a+s.total,0),done=secs.reduce((a,s)=>a+s.done,0);
  return {secs,total,done,pct:total?Math.round(done/total*100):0};
}

/* 소득: 총급여(비과세 제외), 만 원. 모르면 null */
function pInc(pf){
  if(has(pf.inc2026))return num(pf.inc2026);
  if(has(pf.contract))return Math.max(num(pf.contract)-num(pf.nonTax)*12,0);
  return null;
}
function calcP(pf,debts){
  const assets=num(pf.deposit)+num(pf.stock)+num(pf.car)+num(pf.etc);
  const d=debts.reduce((a,r)=>a+num(r.bal),0),mon=debts.reduce((a,r)=>a+num(r.mon),0);
  const inc=pInc(pf);
  return {assets,debts:d,net:assets-d,monthly:mon,inc};
}
function calc(st){
  const f=calcP(st.f,st.debt),m=calcP(st.m,st.debtM);
  const fl=num(st.sc.gfLow),fh=num(st.sc.gfHigh);
  const fInc=f.inc!=null?[f.inc,f.inc]:[fl,fh];
  const mInc=m.inc!=null?m.inc:0;
  return {f,m,assets:f.assets+m.assets,debts:f.debts+m.debts,net:f.net+m.net,monthly:f.monthly+m.monthly,
          incLow:mInc+fInc[0],incHigh:mInc+fInc[1],incKnown:f.inc!=null&&m.inc!=null,fRange:f.inc==null,
          fInc,mInc,mUnknown:m.inc==null};
}

const RANK={o:0,t:1,x:2,n:-1};
const worst=cs=>{let w='o';cs.forEach(c=>{if(RANK[c.m]>RANK[w])w=c.m});return w};
function ratioInfo(incSum,earners,base){
  const monthly=incSum*10000/12;
  return {monthly:Math.round(monthly/10000),ratio:monthly/base*100};
}
/* mode: 'couple'(부부 합산) | 'm'(본인 단독) | 'f'(여자친구 단독) */
function incomeCheck(type,mode,mInc,fInc){
  const R=RULES,base=R.monthly100.p3;
  const couple=mode==='couple';
  let incSum,earn=false;
  if(couple){incSum=(mInc||0)+(fInc||0);earn=(mInc>0)&&(fInc>0)}
  else incSum=mode==='f'?fInc:mInc;
  const ri=ratioInfo(incSum,earn,base);
  const who=couple?'부부 합산':mode==='f'?'여자친구 단독':'본인 단독';
  const lbl=who+' 총급여 '+comma(incSum)+'만 원, 월 '+ri.monthly+'만 원(월평균 '+Math.round(ri.ratio)+'%)';
  const dd={type,who,sum:comma(incSum),monthly:String(ri.monthly),pct:String(Math.round(ri.ratio)),earn};
  if(type==='general'){
    const lim=R.pct.general.first[earn?1:0],cp=comma(Math.round(base*lim/100/10000));
    dd.lim=String(lim);dd.cap=cp;dd.tier=ri.ratio<=lim?'first':'over';
    return ri.ratio<=lim?{m:'o',t:lbl+' ≤ '+lim+'%',k:'income',d:dd}:{m:'x',t:lbl+' > '+lim+'% 한도('+cp+'만 원/월)',k:'income',d:dd};
  }
  const pc=R.pct[type],i=earn?1:0;
  const f1=pc.first[i],s2=pc.second[i],en=pc.entry[i];
  const cap=x=>comma(Math.round(base*x/100/10000))+'만 원/월';
  Object.assign(dd,{f1:String(f1),s2:String(s2),en:String(en),cap1:cap(f1),capEn:cap(en)});
  if(ratio_le(ri.ratio,f1)){dd.tier='first';return {m:'o',t:lbl+' ≤ 1순위 '+f1+'%('+cap(f1)+')'+(earn?', 맞벌이 기준':''),k:'income',d:dd}}
  if(ratio_le(ri.ratio,s2)){dd.tier='second';return {m:'t',t:lbl+', 1순위 '+f1+'% 초과이고 2순위 '+s2+'% 이내',k:'income',d:dd}}
  if(ratio_le(ri.ratio,en)){dd.tier='entry';return {m:'t',t:lbl+', 순위 밖이지만 입주요건 '+en+'% 이내',k:'income',d:dd}}
  dd.tier='over';return {m:'x',t:lbl+' > 입주요건 '+en+'%('+cap(en)+')',k:'income',d:dd};
}
const ratio_le=(a,b)=>a<=b+1e-9;
/* 소득 참고 줄: 본인·여자친구·합산을 모두 보여줌 */
function incomeRef(mInc,fInc){
  const base=RULES.monthly100.p3;
  const one=(n,v)=>v==null?n+' 미입력':n+' '+comma(v)+'만 원('+Math.round(ratioInfo(v,false,base).ratio)+'%)';
  const sum=(mInc==null||fInc==null)?null:mInc+fInc;
  return {m:'n',t:'소득 참고(월평균 대비): '+one('본인',mInc)+' · '+one('여자친구',fInc)+' · '+(sum==null?'합산 미입력':'합산 '+comma(sum)+'만 원('+Math.round(ratioInfo(sum,false,base).ratio)+'%)')};
}

/* line: 'couple'(예비신혼 합산) | 'm' | 'f' | 'post'(혼인 후 합산) */
function assetChecks(st,line){
  const S=st.sc,f=st.f,m=st.m,R=RULES.asset,out=[];
  const momIn=line==='f'||line==='couple'?String(f.household||'')==='같은 세대':line==='post'?String(S.hhAfter||'').indexOf('유지')>=0:false;
  const land=momIn?num(S.momLand):0;
  const mom=momIn?'(어머니 토지 세대 포함 가정)':'(어머니 자산 미포함)';
  const ld={land:comma(land),limit:comma(R.land),mom:momIn};
  if(land>R.land)out.push({m:'x',t:'부동산 '+comma(land)+'만 원 > 한도 '+comma(R.land)+'만 원'+mom,k:'land',d:ld});
  else if(land>=R.land*0.9)out.push({m:'t',t:'부동산 '+comma(land)+'만 원, 한도 '+comma(R.land)+'만 원에 근접'+mom,k:'land',d:ld});
  else out.push({m:'o',t:'부동산 '+comma(land)+'만 원 ≤ 한도 '+comma(R.land)+'만 원'+mom,k:'land',d:ld});
  const cars=line==='m'?[num(m.car)]:line==='f'?[num(f.car)]:[num(m.car),num(f.car)];
  let carNote=momIn?'':'';
  if(momIn){
    if(!has(S.momCar)){out.push({m:'t',t:'어머니 차량 가액 미입력(한도 '+comma(R.car)+'만 원)',k:'momCar',d:{limit:comma(R.car)}});return out}
    cars.push(num(S.momCar));carNote='(어머니 차량 포함)';
  }
  const mx=Math.max.apply(null,cars);
  const cd={mx:comma(mx),limit:comma(R.car),mom:momIn};
  out.push(mx>R.car?{m:'x',t:'자동차 '+comma(mx)+'만 원 > 한도 '+comma(R.car)+'만 원',k:'car',d:cd}:{m:'o',t:'자동차 '+comma(mx)+'만 원 ≤ 한도 '+comma(R.car)+'만 원'+carNote,k:'car',d:cd});
  return out;
}
function cheongCheck(p,notice,needSavings){

const LINES=[['couple','예비신혼 합산'],['m','본인 단독'],['f','여자친구 단독'],['post','혼인신고 후']];
const TYPES=[['newlywed','신혼부부 특별공급(예비신혼 포함)','신혼'],['firstTime','생애최초 특별공급','생애최초'],['general','일반공급','일반']];
/* 사람별 청약 정보 줄: 통장, 지역우선(+단절), 생애최초면 저축액·소득세. mark=false면 참고(–) */
function personRows(st,w,type,mark){

  }

  rows.push({m:rs.m==='x'?'t':rs.m,t:rs.t+(rs.m==='o'?(outside?'. 주소 이력에 타 지역 '+outside+'건 있음, 연속 여부 확인':'. 주소 이력상 단절 없음'):''),k:rs.k,d:Object.assign({},rs.d,{outside:String(outside)})});
  if(type==='firstTime'){

  return rows.map(x=>({m:mark?x.m:'n',t:(mark?'':'(참고) ')+nm+' – '+x.t,k:x.k,d:Object.assign({who:w},x.d)}));

function evalLine(st,type,line,A,fInc){

    checks.push(incomeRef(mInc,fInc));

  }else if(line==='f'){
    if(!fH)checks.push({m:'t',t:'여자친구 주택 보유 여부 미입력',k:'house',d:{who:'f'}});
    else checks.push(String(f.ownHouse)!=='없음'?{m:'x',t:'여자친구 명의 주택 보유',k:'house',d:{who:'f'}}:{m:'o',t:'여자친구 명의 주택 없음',k:'house',d:{who:'f'}});
  }else{
    if(!mH||!fH)checks.push({m:'t',t:'주택 보유 여부 미입력',k:'house',d:{who:'both'}});
    else if(String(m.ownHouse)!=='없음'||String(f.ownHouse)!=='없음')checks.push({m:'x',t:'본인 또는 배우자 명의 주택 보유',k:'house',d:{who:'both'}});
    else checks.push({m:'o',t:'두 분 모두 본인 명의 주택 없음',k:'house',d:{who:'both'}});
  }
  if(line!=='m'&&String(f.parentHouse||'')==='있음'){

    checks.push(sameFather?{m:'x',t:'같은 세대 아버지 명의 주택 있음',k:'fatherHouse'}:{m:'o',t:'아버지 명의 주택은 세대가 달라 제외(주민등록 세대 분리 확인)',k:'fatherHouse'});
  }
  /* 소득 */
  const mode=single?line:'couple';
  const need=mode==='m'?mInc==null:mode==='f'?fInc==null:(mInc==null||fInc==null);
  if(need){const mw=(mode==='m'||(mode==='couple'&&mInc==null))?'m':'f';checks.push({m:'t',t:(mw==='m'?'본인':'여자친구')+' 소득 미입력',k:'incomeMissing',d:{who:mw}})}
  else checks.push(incomeCheck(type,mode,mInc,fInc));
  checks.push(incomeRef(mInc,fInc));
  if(single)checks.push({m:'n',t:'1인 가구 소득 기준은 가구원수별로 따로 있을 수 있어 확인하지 못함(미확인, 3인 이하 기준으로 계산)',k:'singleIncUnknown'});
  /* 자산 */
  assetChecks(st,line).forEach(c=>checks.push(c));
  /* 혼인 요건 */

    else checks.push(ymIdx(S.marry)<=ymIdx(S.moveIn)?{m:'o',t:'혼인신고 예정월이 입주 예정월 이전',k:'marryVsMoveIn',d:{marry:fmtMonth(S.marry),moveIn:fmtMonth(S.moveIn)}}:{m:'x',t:'혼인신고 예정월이 입주 예정월보다 늦음',k:'marryVsMoveIn',d:{marry:fmtMonth(S.marry),moveIn:fmtMonth(S.moveIn)}});
  }else if(type==='firstTime'){
    if(!pre)checks.push({m:'o',t:'혼인 중(가목)',k:'firstMarried'});
    else checks.push({m:'t',t:'혼인 전: 1인 가구로 단독 신청(나목), 단독세대주는 전용 60㎡ 이하만',k:'firstSingle'});
    const own=(line==='m'?m:f).ownHist;
    if(!has(own)||String(own).indexOf('없')<0)checks.push({m:'t',t:'과거 주택 소유 이력 확인 필요(세대원 전원)',k:'ownHist'});
  }
  /* 사람별 청약 정보: 판정 대상 사람은 마크, 나머지는 참고 */
  const who=single?[line]:[A,A==='m'?'f':'m'];
  who.forEach((w,i)=>personRows(st,w,type,i===0).forEach(c=>checks.push(c)));
  return {m:worst(checks),na:false,checks};
}
function mergeCells(a,b){
  const out=[];
  for(let i=0;i<a.length;i++){
    const x=a[i],y=b[i]||a[i];
    if(x.m===y.m){out.push(x.t===y.t?x:{m:x.m,t:x.t+' / 상한 가정: '+y.t.replace(/^소득 참고\(월평균 대비\): /,''),k:x.k,d:x.d,d2:y.d});}
    else out.push({m:(x.m==='x'&&y.m==='x')?'x':'t',t:'소득 추정 범위에 따라 갈림 → '+x.t+' / '+y.t,k:x.k,d:x.d,d2:y.d,split:true});
  }
  return out;
}
function mergeLines(a,b){

}
function evalTypes(st){
  const A=st.sc.applicant==='본인'?'m':'f';
  const f=pInc(st.f);
  const lo=f!=null?f:num(st.sc.gfLow),hi=f!=null?f:num(st.sc.gfHigh);
  const rangeUsed=f==null;
  const rows=TYPES.map(([k,l,sh])=>{
    const r={key:k,label:l,short:sh,preLines:{}};
    LINES.forEach(([L])=>{
      const one=x=>evalLine(st,k,L,A,x);
      const cell=(!rangeUsed||lo===hi)?one(f!=null?f:lo):mergeLines(one(lo),one(hi));
      if(L==='post')r.post=cell;else r.preLines[L]=cell;
    });
    /* 기존 호환: pre는 12번 섹션 신청자 선택에 따라 강조되는 줄 */
    r.focus=k==='newlywed'?'couple':A;
    r.pre=r.preLines[r.focus];
    return r;
  });
  /* 요약: 줄 × 전형 마크, 전형별 가장 유리한 혼인 전 줄 */
  const table=LINES.map(([L,lab])=>({line:L,label:lab,marks:rows.map(r=>(L==='post'?r.post:r.preLines[L]).m)}));
  const sc={o:2,t:1,x:0};
  const best=rows.map(r=>{
    let pick=null;
    ['couple',A,A==='m'?'f':'m'].forEach(L=>{
      const c=r.preLines[L];if(c.na)return;
      if(!pick||sc[c.m]>sc[pick.cell.m])pick={line:L,cell:c};
    });
    return {key:r.key,short:r.short,line:pick?pick.line:null,m:pick?pick.cell.m:'x',post:r.post.m};
  });
  const lab=Object.fromEntries(LINES);
  const textPre=best.map(b=>b.short+(b.line?'('+lab[b.line]+' '+MARK[b.m]+')':' ✕')).join(' · ');
  const textPost=rows.map(r=>r.short+' '+MARK[r.post.m]).join(' · ');
  return {rows,applicant:A,rangeUsed,lo,hi,summary:{table,best,textPre,textPost}};
}
function residence(p,list,city,notice){
  const cur=String(p.regCity||'');

  if(cur.indexOf(city)<0){
    const rd=toDate(p.regDate);
    const mo=rd?Math.max(Math.floor(yearsBetween(rd,notice)*12),0):null;
    return {m:'x',t:'주민등록 '+cur+(mo!=null?' 전입 '+mo+'개월':'')+', '+city+' 거주 이력이 끊김(지역우선 불리)',k:'resBroken',d:{cur,mo:mo!=null?String(mo):'',city}};
  }
  let earliest=null;

}
function applicantCompare(st){

  const mr=per(st.m,st.addrM),fr=per(st.f,st.addr);

  return {rows:out,verdict,sm,sf};
}

  const need=Math.max(price+cost-fund,0);

  const yrs=Math.max(num(S.years),1),rate=flt(S.rate)/100/12;
  const pay=pmt(rate,yrs*12,need);
  const loanBy=need>0?Math.min(need,limit):0;
  const short=Math.max(need-limit,0);
  const incTxt=(lim,inc)=>inc<=lim?'o':'x';
  const iLo=c.incLow,iHi=c.incHigh;
  const fmtR=(a,b)=>a===b?comma(a)+'만 원':comma(a)+'~'+comma(b)+'만 원';
  const incMark=(lim)=>{const a=iLo<=lim,b=iHi<=lim;return a&&b?'o':(!a&&!b?'x':'t')};
  const netAsset=c.net;
  const dsrLo=iHi>0?pay*12/iHi*100:null,dsrHi=iLo>0?pay*12/iLo*100:null;
  return {price,cost,liquid,gifts,fund,need,limit,pay,short,iLo,iHi,incRange:fmtR(iLo,iHi),
    mNewly:incMark(D.newlywed),mFirst:incMark(D.firstTime),mGen:incMark(D.general),
    mSingle:(function(){const mi=c.mInc;return mi<=D.firstTime?'o':'x'})(),
    singleInc:c.mInc,netAsset,netOk:netAsset<=D.netAsset,priceOk:price<=D.priceCap,dsrLo,dsrHi,yrs,rate:flt(S.rate)};
}
function giftCalc(st){
  const G=RULES.gift,S=st.sc,marry=ymIdx(S.marry);
  const groups={};
  st.sup.forEach(r=>{if(num(r.amt)>0){const k=r.to||'여자친구';(groups[k]=groups[k]||[]).push(r)}});
  const taxOf=base=>{
    if(base<=0)return 0;
    if(base<50)return 0;
    for(const b of G.brackets){if(base<=b[0])return Math.round(base*b[1]-b[2])}
    return 0;
  };
  return Object.keys(groups).map(to=>{
    const rows=groups[to].map(r=>{
      const idx=ymIdx(r.date);
      const assumed=idx==null;
      const inWin=assumed?true:(marry!=null&&Math.abs(idx-marry)<=G.windowMonths);
      const dl=idx!=null?lastDayOfIdx(idx+G.filingMonths):null;
      return {who:r.who||'(지원자 미입력)',amt:num(r.amt),date:r.date,assumed,inWin,deadline:dl};
    });
    const total=rows.reduce((a,r)=>a+r.amt,0);
    const win=rows.filter(r=>r.inWin).reduce((a,r)=>a+r.amt,0);
    const basic=Math.min(G.basic,total);
    const mDed=marry!=null?Math.min(G.marriage,win):0;
    const baseA=Math.max(total-basic-mDed,0),baseB=Math.max(total-basic,0);
    const gross=x=>taxOf(x);
    const net=x=>Math.round(gross(x)*(1-G.credit));
    return {to,rows,total,basic,mDed,baseA,baseB,taxA:gross(baseA),netA:net(baseA),taxB:gross(baseB),netB:net(baseB),
      win:marry!=null?{from:idxStr(marry-G.windowMonths),to:idxStr(marry+G.windowMonths)}:null};
  });
}

const MARK={o:'○',t:'△',x:'✕',n:'–'};
function buildMd(st){
  const p=progress(st),c=calc(st);
  const L=[];
  const nameF=cell(st.f.nick||''),nameM=cell(st.m.nick||'');
  L.push('# 내집마련 정보 정리'+(nameF||nameM?' - '+[nameM,nameF].filter(Boolean).join(' / '):''));
  L.push('');
  L.push('- 작성일시: '+nowStr());
  L.push('- 입력 기준일: '+(fmtDate(st.asOf)||'미입력'));
  L.push('- 규정 기준일: '+RULES.asOf+' (참고용, 모든 판정은 추정. 실제 자격은 입주자 모집공고문과 기관 심사가 우선)');
  L.push('- 입력 진행률: '+p.pct+'% ('+p.done+'/'+p.total+'개 항목)');
  L.push('');
  const missing=[];
  const fieldRows=(s)=>{
    const pf=store(st,s.w);
    s.fields.forEach(f=>{
      const v=has(pf[f.k])?(f.t==='num'?man(pf[f.k]):f.t==='int'?pf[f.k]+(f.u||''):f.t==='dec'?pf[f.k]+(f.u||''):f.t==='range'?man(pf[f.k]):f.t==='date'?fmtDate(pf[f.k]):f.t==='month'?fmtMonth(pf[f.k]):cell(pf[f.k])):null;
      L.push('| '+f.l+' | '+(v===null?'미입력':v)+' |');
      if(v===null&&s.req.includes(f.k))missing.push(s.title.replace(/^\d+\.\s*/,'')+' > '+f.l);
    });
  };
  SECTIONS.forEach(s=>{
    L.push('## '+s.title);L.push('');
    if(s.id==='todo'){
      if(!st.todo.length)L.push('미입력');
      st.todo.forEach(t=>L.push('- ['+(t.done?'x':' ')+'] '+(cell(t.t)||'(내용 없음)')+(t.due?' (기한 '+fmtDate(t.due)+')':'')));
      L.push('');return;
    }
    if(s.fields.length){L.push('| 항목 | 내용 |');L.push('|---|---|');fieldRows(s);L.push('')}
    if(s.check){L.push('- '+s.check.l+': '+(st[s.check.k]?'예':'아니오'));L.push('')}
    if(s.list){
      const lst=LISTS[s.list],rows=st[s.list].filter(r=>Object.keys(r).some(k=>String(r[k]).trim()!==''));
      L.push('**'+lst.label+'**');L.push('');
      if(!rows.length){
        L.push('미입력');
        if(!(s.check&&st[s.check.k]))missing.push(s.title.replace(/^\d+\.\s*/,'')+' > '+lst.label);
      }else{
        L.push('| '+lst.cols.map(x=>x.l.replace(/\(.*\)/,'')).join(' | ')+' |');
        L.push('|'+lst.cols.map(()=>'---').join('|')+'|');
        rows.forEach(r=>L.push('| '+lst.cols.map(x=>{
          const v=r[x.k];if(String(v).trim()==='')return '미입력';
          return x.t==='num'?man(v):x.t==='month'?fmtMonth(v):cell(v);
        }).join(' | ')+' |'));
      }
      L.push('');
    }
  });
  L.push('## 자동 계산 (두 분 합산)');L.push('');
  L.push('| 항목 | 금액 |');L.push('|---|---|');
  L.push('| 총자산 | '+manBig(c.assets)+' |');
  L.push('| 총부채 | '+manBig(c.debts)+' |');
  L.push('| 순자산 | '+(c.net<0?'-':'')+manBig(Math.abs(c.net))+' |');
  L.push('| 월 대출 상환액 합계 | '+comma(c.monthly)+'만 원 |');
  L.push('| 예상 합산 연소득(총급여) | '+(c.incLow===c.incHigh?manBig(c.incLow):comma(c.incLow)+'~'+comma(c.incHigh)+'만 원')+(c.fRange?' (여자친구 소득은 추정 범위)':'')+' |');
  L.push('');
  /* 판정 */
  const ev=evalTypes(st);
  L.push('## 전형 판정 요약 (추정, 신청자: '+(ev.applicant==='m'?'본인':'여자친구')+')');L.push('');
  if(ev.rangeUsed)L.push('여자친구 소득은 미입력이라 '+comma(ev.lo)+'~'+comma(ev.hi)+'만 원 추정 범위로 계산했습니다.');
  L.push('');
  L.push('| 구분 | '+ev.rows.map(r=>r.short).join(' | ')+' |');L.push('|---|'+ev.rows.map(()=>'---').join('|')+'|');
  ev.summary.table.forEach(t=>L.push('| '+t.label+' | '+t.marks.map(x=>MARK[x]).join(' | ')+' |'));
  L.push('');
  L.push('- 가장 유리한 조합(혼인 전): '+ev.summary.textPre);
  L.push('- 혼인 후: '+ev.summary.textPost);

    e.style.width=w+'px';e.style.maxHeight=Math.floor(vh*0.7)+'px';

    let left=Math.min(Math.max(16,b.left+b.width/2-w/2),vw-w-16);

    const h=e.offsetHeight,below=vh-b.bottom-8,above=b.top-8;
    let top=below>=h||below>=above?b.bottom+6:b.top-h-6;
    top=Math.max(8,Math.min(top,vh-h-8));
    e.style.top=top+'px';
  }

  function readEl(t){
    if(t.type==='checkbox')return t.checked;
    const cl=t.classList;
    if(cl.contains('num')||cl.contains('int')||cl.contains('dec')){
      const caret=t.selectionStart||0;
      const isDec=cl.contains('dec');
      const re=isDec?/[^\d.]/g:/\D/g;
      const before=t.value.slice(0,caret).replace(re,'').length;
      let d=t.value.replace(re,'');
      if(isDec){const i=d.indexOf('.');if(i>=0)d=d.slice(0,i+1)+d.slice(i+1).replace(/\./g,'')}
      else d=d.replace(/^0+(?=\d)/,'');
      t.value=d===''?'':(cl.contains('num')?comma(d):d);
      try{
        let pos=0,cnt=0;
        while(pos<t.value.length&&cnt<before){if(/[\d.]/.test(t.value[pos]))cnt++;pos++}
        t.setSelectionRange(pos,pos);
      }catch(e){}
      return d;
    }
    return t.value;
  }

    }catch(e){}
    ta.setAttribute('readonly','');ta.focus();ta.select();
    showMsg('copyMsg','자동 복사가 막혀 있습니다. 위 글을 길게 눌러 전체 선택 후 복사하세요.',true);
  });

  let downloads=null;
  (async()=>{try{if(window.claude&&claude.use)downloads=await claude.use('downloads')}catch(e){}})();
  $('btnSave').addEventListener('click',async()=>{
    const data=JSON.stringify(st,null,2);
    const nm=(st.f.nick||'').trim().replace(/[\\/:*?"<>|\s]+/g,'_');
    const fname='내집마련_'+(nm?nm+'_':'')+todayStr()+'.json';
    if(downloads){
      try{await downloads.save({filename:fname,data});showMsg('bkMsg','저장 요청을 보냈습니다.');return}
      catch(err){if(err&&err.code==='declined'){showMsg('bkMsg','저장을 취소했습니다.',true);return}}
    }
    try{await navigator.clipboard.writeText(data);showMsg('bkMsg','파일 저장이 막혀 있어 백업 코드를 복사했습니다. 메모 앱 등에 붙여 두세요.')}
    catch(e){
      $('outTxt').value=data;$('outBox').hidden=false;$('outTxt').focus();$('outTxt').select();
      showMsg('bkMsg','저장과 복사가 모두 막혀 있습니다. 아래 정리본 칸에 백업 코드를 띄웠으니 직접 복사하세요.',true);
    }
  });
  $('btnLoad').addEventListener('click',()=>$('fileIn').click());
  $('fileIn').addEventListener('change',e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{
      try{st=sanitize(JSON.parse(String(r.result)));renderAll();persist();showMsg('bkMsg','불러왔습니다.')}
      catch(err){showMsg('bkMsg','읽을 수 없는 파일입니다. 이 앱에서 저장한 JSON 파일을 선택하세요.',true)}
    };
    r.onerror=()=>showMsg('bkMsg','파일을 읽지 못했습니다.',true);
    r.readAsText(file);e.target.value='';
  });

  $('btnReset').addEventListener('click',()=>{
    $('resetBox').innerHTML='<div class="confirm"><div>입력한 내용을 바꿉니다. 먼저 JSON 파일로 저장해 두면 되돌릴 수 있습니다.</div><div class="btns"><button type="button" class="del" id="rsYes">모두 지우기</button><button type="button" id="rsSeed">알려진 정보로 되돌리기</button><button type="button" id="rsNo">취소</button></div></div>';
    $('rsNo').onclick=()=>{$('resetBox').innerHTML=''};
    const apply=(next,msg)=>{
      st=next;
      try{localStorage.removeItem(STORE_KEY)}catch(e){}
      $('resetBox').innerHTML='';$('outBox').hidden=true;
      renderAll();persist();showMsg('bkMsg',msg);
    };
    $('rsYes').onclick=()=>apply(blankState(),'모두 지웠습니다.');
    $('rsSeed').onclick=()=>apply(sanitize(SEED()),'모두 비웠습니다.');
    $('rsNo').focus();
  });

  renderAll();
})();
}
</script>
</body>
</html>
